# runyard-sandboxes: microVMs from OCI images, and the plane that drives them.
#
# PROPOSED. Nothing implements this yet.
#
# 3.0.3 rather than 3.1, for the reason runyard's own server contract gives: the
# far end of this document is somebody else's integration, generating a client
# against a toolchain we do not choose. A dialect that costs a third party a
# working client buys nothing this document needs.
openapi: 3.0.3

info:
  title: runyard-sandboxes
  version: 1.0.0
  description: |
    **One API in front of a pool of microVMs: it makes them from OCI images,
    runs things inside them, moves bytes in and out, and drops them.**

    It knows nothing about agents, conversations, transcripts, harnesses or
    models. That is the split this service exists to make: `runyard` is the
    thing that runs an agent, and it runs it *in* one of these. A sandbox here
    is a machine with a disk, an interface and a policy, and every question this
    API answers is a question about a machine.

    ### Why this is a separate service

    In `runyard-ai/runyard` the two planes are one server: `/v1/boxes` makes
    machines and `/v1/sessions` holds conversations, and the box plane is
    reachable only by going through a server that also has opinions about
    Claude. Those opinions are the valuable part of runyard and the wrong
    dependency for anybody who wants a VM.

    So the machine plane moves here and becomes general. The test for whether a
    field belongs in this document is whether it would still make sense to
    somebody running an untrusted build, a CI job, a browser or a database in a
    sandbox — not whether runyard needs it. `harness`, `model`, `session` and
    `transcript` are all on the other side of that line and none of them appear
    below.

    What runyard then does is build its own image — Claude and pi inside, a
    `Dockerfile`, a `docker push` — and `POST /v1/sandboxes` with that
    reference. Everything runyard-specific becomes a layer in an image instead
    of a field in an API, which is the whole point.

    ### An image is an OCI reference, and it is said out loud

    `spec.image` is `ghcr.io/runyard-ai/claude-sandbox:2026-09`. A registry, a
    repository, a tag or a digest — the string you would hand `docker pull`.

    A registry is spoken to over HTTPS, with one exception that is Docker's
    own: one on this host's loopback (`localhost:5000/…`, `127.0.0.1:5000/…`)
    that answers in plain HTTP is spoken to in plain HTTP. That is how an image
    built on the host reaches its daemon — `docker run registry:2` and a
    `docker push` — and nothing between the two crosses a network.

    This is a deliberate inversion of runyard's server contract, which refuses
    image references on the grounds that they are the orchestrator leaking into
    the API. That argument is right there and wrong here: **this service IS the
    orchestrator.** A layer whose only job is to turn a curated key into an
    image reference would be a second registry with worse tooling, and the
    reason people want this at all is that they already know how to change a
    `Dockerfile`.

    **A VM boots a filesystem, not a container.** An image's layers are
    flattened into an ext4 rootfs once, cached by manifest digest — see `POST
    /v1/images` — and every sandbox from that image boots the same one,
    attached read-only. What a sandbox writes goes to a disk of its own, which
    starts empty and is laid over the image inside the guest, the way a
    container's writable layer is. So a sandbox costs what it writes rather than
    what its image weighs, and making one copies nothing of the image: on a
    host whose filesystem cannot clone a file, copying a 600 MB image was
    most of a create.

    **Every sandbox's disk is a volume, and can be the next one's.** Named in
    `spec.disk.volume`, or given a random name when the spec names none, it is
    made empty the first time, and attached as it was left to each sandbox
    that names it after — one at a time, and only over the image it was first
    laid over. See `GET /v1/volumes`. That is how a workload that runs in
    short turns keeps its files between them without keeping a machine: each
    turn is a new sandbox, and nothing is copied to give it the last one's
    disk.

    **The image does not have to know it is being run by us.** The guest agent
    that answers the exec and file routes is injected at rootfs-build time and
    is the guest's init; the image's own `ENTRYPOINT`/`CMD` is started by it as
    an ordinary supervised process, visible at `GET
    /v1/sandboxes/{id}/processes` under the name `entrypoint`. An unmodified
    `node:22`, `postgres:17` or `ubuntu:24.04` boots and works. Nothing has to
    be based on ours, and there is no unit to add.

    **There is no build plane here and there will not be one.** Building an
    image is `docker build` and `docker push`, on a machine with a Docker daemon
    and a build cache, in a CI job that already exists. A `POST /v1/builds` on
    the host that runs untrusted microVMs would put a compiler, a registry
    credential and an arbitrary `Dockerfile` on exactly the machine this project
    is about keeping small.

    ### Every sandbox has a network namespace, and its firewall starts closed

    Not "may have an interface". **Has one**, always, inside a network
    namespace of its own, and the firewall exists before the interface does.

    **One namespace per sandbox is one firewall per sandbox.** The hypervisor
    runs inside the namespace, so the TAP it is given lives there too, and so
    does the sandbox's resolver; the sandbox's rules are an nftables table in
    that namespace and nowhere else. The kernel keeps a ruleset per namespace:
    nothing on the host — Docker's rules, firewalld's, an operator's `nft flush
    ruleset` — is judged against a sandbox's packets in place of its own
    table, or can take that table away, and no sandbox's table is judged
    against another's. The namespace is pinned on the host
    (`/run/netns/runyard-<instance>-<id>`) rather than held by a process, so a
    restart or an upgrade of this daemon leaves every rule where it was.

    **Leaving the host still crosses the host.** A packet a sandbox is allowed
    to send to the internet goes out of its namespace over a veth and is
    forwarded by the host's own stack, and there a `drop` in any table is
    final. Docker sets the host's `FORWARD` policy to `drop`, so on a host that
    runs Docker this daemon adds two rules to Docker's `DOCKER-USER` chain —
    what the sandboxes' veths send, and the answers to it — and states them
    again every time it starts. Those, and one table of its own on the host —
    the NAT out, and a refusal of anything a sandbox addresses to the host or
    to another sandbox — are the only rules this daemon writes outside a
    sandbox's namespace. The namespace refuses the host's addresses itself as
    well, and is told them again whenever they change, so a flushed host
    table takes away a sandbox's way out and nothing it is refused.

    **Several daemons share a host by name.** Each is an instance
    (`instance` on `GET /v1/host`), and everything it makes on the host
    outside a sandbox's namespace is named by it: its table, its sandboxes'
    namespaces and their links, its rules in `DOCKER-USER`. Stating its own
    touches no other instance's. A daemon will not start as an instance
    another daemon is running as, on a state directory another is using or
    that belongs to another instance, or on a subnet that overlaps one
    another instance's sandboxes are on.

    That is three decisions:

    - **The rules are installed before the device is handed to the hypervisor.**
      There is no ordering in which a VM briefly holds an unfiltered interface,
      because the namespace's firewall is installed while the namespace is
      still empty, its chains drop whatever they do not accept, and creating
      the namespace, its firewall and its devices is one operation that fails
      as a unit. A failure leaves a sandbox with no interface rather than an
      open one.
    - **Nothing on the host is on a sandbox's network.** Its gateway and its
      resolver are addresses in its own namespace; the host's own addresses
      are refused whatever the sandbox's rules allow, and so is every other
      sandbox. The brokers are not on this path: they are carried over the
      machine's vsock.
    - **A sandbox with no `egress` in its spec reaches its own resolver and
      nothing else.** Deny-by-default is the default, and it is said here rather
      than left to be discovered — "nothing" is otherwise indistinguishable from
      a broken network, and the first thing anybody does with a broken network
      is turn the firewall off.

    The alternative — no interface at all when no policy is asked for — is
    tempting and worse: it makes "locked down" and "not networked" two different
    code paths, and only one of them gets the attention. Here there is one path,
    and `egress: {}` and `egress: {rules: [{name: github, domains: [github.com]}]}`
    differ by the contents of a list.

    `GET /v1/sandboxes/{id}/egress` reports the live policy **and the last
    refusals**, because a deny-by-default network whose refusals are invisible
    is a network people disable. Its rules are named, and each is added,
    replaced, paused, resumed and removed on its own at
    `.../egress/rules/{ruleName}` on a running machine — or all at once with
    `PUT .../egress`.

    ### Naming: this daemon names what it creates, and the caller labels it

    **A sandbox's id is a UUID this daemon mints, and no two sandboxes ever have
    the same one** — not two on one host at once, and not a sandbox and the one
    created after it was dropped. The id is what the machine's identity is made
    of: it is the `uri` an upstream sees on a brokered call, and an upstream
    that authorises `pr-1234` must not go on authorising whatever is called
    `pr-1234` next week. A name the caller chose cannot promise that, because a
    caller can choose it again.

    What a person reads is a **label**: `labels.name`, which the console renders
    in place of the id and `?label=name=…` finds. It is not unique and nothing
    here interprets it.

    `POST /v1/sandboxes` therefore — and a lost response must still not create
    a second machine, because a caller whose connection dropped has started a VM
    it cannot name, cannot stop and cannot find, and its retry makes another. So
    the create carries an **`Idempotency-Key`** the caller chose: a repeat with
    the same key returns the machine the first one made.

    Images are the other case: `POST /v1/images` with a reference, because an
    image is content-addressed. The id is derived from the
    manifest digest, so the same reference posted twice is the same image by
    construction and there is no id for a caller to invent.

    ### Two lifecycles, kept apart

    `sandbox.state` answers *is there a machine* — `creating`, `booting`,
    `ready`, `unreachable`, `stopped`, `failed`, `gone`. Nothing else in this
    document has a state, which is the difference between this API and the one
    it was split out of: there is no agent here whose liveness could be confused
    with the machine's.

    `unreachable` and `failed` are separate because retrying fixes one and never
    fixes the other, and "reconnecting…" forever is worse than a reason.

    ### The daemon restarting is not the sandbox stopping

    Every sandbox is written down on the host, and outlives the daemon that
    made it — whether that daemon was upgraded, told to stop, or killed. The
    next one answers for the same ids, specs, labels, brokers on the same ports,
    idempotency keys and event history, with sequence numbers that carry on, so
    a cursor held across the restart still reads on from where it was.

    A machine that was running and still is — its daemon was restarted for an
    upgrade, or killed — is taken back as it is: `ready`, with every process in
    it still running and every process cursor still good. Only the host's side
    was away: a broker connection open across the restart is cut, and a new one
    works. A machine that is not there any more — the host rebooted, or its
    daemon was told to take its machines down — comes back `creating` and boots
    again on its own disk, from the image digest it was first made from.
    What was `stopped` stays stopped, what `failed` keeps its reason, and a
    `DELETE` that did not finish is listed `gone` until it is sent again.

    ### Streams

    `GET /v1/sandboxes/{id}/events` is a chunked `application/x-ndjson` body:
    one envelope per line, in sequence order, `?from=` naming the last sequence
    the caller committed. Process output is the same shape. Not a WebSocket:
    this is bytes in one direction, which is what an HTTP body already is.

    ### Keys

    Every request carries `Authorization: Bearer rysk_<id>_<secret>`, scoped and
    expiring. The first key is minted by this daemon's own command line, on the
    host, not by this API: every route that decides a key should exist is called
    with a credential, by somebody who may do what the key will.

    One route hands a key over and is shown no credential:
    `POST /v1/keys/authorizations/redeem`, by which a program on a person's
    machine collects the key that person approved for it in the console. It
    is not a way to a first credential. It hands over only what a signed-in
    person approved minutes earlier, once, and only to whoever holds the
    verifier that approval was bound to before it was given; with nothing
    approved it answers nothing.

    A key's scopes say what it may do, and its reach says to which sandboxes:
    every one on the host, or only those it made itself (`KeyReach`).

    ### What is deliberately not here

    **No snapshots yet.** Cloud Hypervisor can snapshot and restore, a restore
    is the difference between a two-second sandbox and a twenty-second one, and
    a warm pool is the obvious next thing this service should hold. It is absent
    because it is not designed: a restored VM has a clock, a set of open
    sockets and an interface that all belong to the moment it was captured, and
    an API that pretended otherwise would be one people build on before it works.
    It arrives as `/v1/snapshots` plus `spec.from`, additively.

    **No host bind mounts.** `mounts: [{host: /srv/repo, guest: /work}]` is the
    field everybody asks for first, and it turns this API into one that reads
    the host's filesystem — the guard is an operator-side prefix allowlist, and
    a guard whose failure mode is "the sandbox got `/etc`" is one to add
    deliberately rather than early. The file routes cover moving bytes in and
    out. It comes back with the allowlist advertised in `GET /v1/info` and a
    `422` naming it.

    **Two WebSockets, and only two.** `GET /v1/sandboxes/{id}/terminal` is an
    interactive shell with a PTY, and `GET
    /v1/sandboxes/{id}/brokers/{name}/serve` carries a client broker's
    connections to the caller serving it. Each is a WebSocket because it is
    bytes in BOTH directions at once, for as long as the caller stays.
    Everything else stays a request or a chunked body.

    **No credentials of any kind.** There is no field in this document that
    could carry a token, a key or a registry password, which is a stronger
    property than a validator that refuses them. Anything written into a sandbox
    is disclosed to the workload by definition — see `PUT
    /v1/sandboxes/{id}/files`. Registry credentials for a private image are this
    daemon's configuration, not a field on a pull.

servers:
  - url: http://127.0.0.1:8099
    description: >-
      One daemon, on one host, owning that host's VMs. Where it listens and who
      can reach it is the deployment's business; nothing here depends on the
      address.

security:
  - apiKey: []
  - session: []

tags:
  - name: Meta
    description: Liveness, protocol, and what this host can do.
  - name: Images
    description: >-
      OCI references turned into the rootfs a VM boots, and the cache of them.
      Content-addressed, so pulling twice costs one pull.
  - name: Sandboxes
    description: >-
      The machines: making them, seeing them, stopping them, dropping them. One
      sandbox is one microVM with one disk and one interface.
  - name: Volumes
    description: >-
      Every sandbox's disk, by name: what it wrote over its image. Kept when
      its sandbox is dropped, so the next sandbox that names it boots with
      what the last one left.
  - name: Network
    description: >-
      What a sandbox may reach, and what it tried to reach and could not. Every
      sandbox starts closed.
  - name: Tunnels
    description: |
      A port of a sandbox, at a public address, for the people and tokens
      its tunnel names.

      Three services and a guest carry it, and this daemon is none of the
      ones a visitor touches. The **gateway** is public: it signs a visitor in
      with Google, checks them against the tunnel, and asks for their bytes.
      This host's **relay** holds a line to it, and carries each visitor's
      connection over the sandbox's vsock to the **agent**, which dials the
      port on the sandbox's loopback. This daemon writes down what the relay
      serves — a file the relay watches — and is out of the path: restarting
      or upgrading it ends no visitor's connection.

      Who may reach a tunnel is decided here and enforced by the gateway,
      which cannot change it: nothing reaches back from the public side.
  - name: Exec
    description: |
      Running something inside a sandbox.

      Two doors. `POST .../commands` waits, collects and caps — the shorthand
      for a health check, a migration, a `git` invocation whose output is
      parsed. `POST .../processes` is the one whose result survives a dropped
      connection: a handle, output read from a cursor, an end asked about
      separately. Anything long-running is a process, not a command.
  - name: Brokers
    description: |
      The way out of a sandbox, and the only one.

      A sandbox's network starts closed. What it is given instead is a set of
      loopback ports inside itself, each carried over its vsock to this daemon,
      which opens a TLS connection to the upstream and attaches the sandbox's
      own client certificate — minted by this host's CA, held here, and
      readable by nothing inside the machine.

      **Three kinds of broker, one mechanism.**

      - A **shared** broker is declared on this host by `PUT /v1/brokers/{name}`
        — there is no other way to declare one — and any sandbox may be given
        it by name. It is a live reference: changing a shared broker's upstream
        changes where every sandbox using it is carried, on its next
        connection.
      - A **one-off** broker is declared inside one sandbox's spec, or attached
        to it later, with its upstream written out. Nothing else can name it,
        and it goes when the sandbox does.
      - A **client** broker is one a caller of this API holds: it exists from
        the moment the caller opens `GET
        /v1/sandboxes/{id}/brokers/{name}/serve` until that connection ends,
        and its connections are handed to the caller. What answers the
        workload is the caller's own program, wherever it runs — so a
        credential it puts on a request never reaches the sandbox, and never
        reaches this host either. It is in no spec and nothing declares it:
        when its caller goes, so does it.

      Either way the workload sees the same thing: a port on `127.0.0.1`, and
      the whole set in `/run/runyard/brokers.json` — the same file, in the same
      shape, that a runyard box publishes — with `/run/runyard/brokers.env`
      beside it for a reader with no JSON parser. Both are rewritten whenever the
      set changes, after the ports are open, so neither ever names a port that
      nothing accepts on.

      A client broker is dialled nowhere, so nothing below about where a
      one-off broker may go applies to it, and no certificate is presented: the
      caller holding it was authenticated when it began to, and is told which
      sandbox it serves by the path it asked for.

      **A one-off upstream is a destination the CALLER chose,** which a shared
      broker is not, and it is dialled from this host rather than from the
      sandbox's own firewalled interface. So by default it is dialled only to
      public addresses: loopback, link-local, private and unspecified addresses
      are refused at connect time, after resolution — they are this host's own
      services, its cloud's metadata endpoint and the operator's network, and
      an A record is written by whoever runs the domain. An operator who wants
      one-off brokers to reach those starts the daemon with
      `-broker-allow-private`, and `GET /v1/info` says which it is. A shared
      broker, declared by whoever holds `brokers.admin`, may point anywhere.

  - name: Files
    description: The bytes inside a sandbox, by absolute path.
  - name: System
    description: |
      What is running inside a sandbox and what it has open: its whole process
      table and every TCP and UDP socket, read by the agent from the guest's
      own `/proc`, so they need nothing in the image — no `ps`, no `ss`.

      **Both are the guest's account of itself**, like the guest half of
      `GET .../metrics`: a sandbox is a machine running somebody else's code,
      and a process that wanted to be missing from this list could arrange it.

      Both need `files.read`, not `sandboxes.read`. A command line carries
      whatever its author put in it — a token passed as a flag is the ordinary
      case — and these answer nothing that reading `/proc` through
      `GET .../files` would not.
  - name: Keys
    description: |
      Minting, listing and revoking the credentials this API is called with.

      **Every key belongs to a person**, and does what its own scopes say and
      its owner may still do, whichever is less. A person taken off this
      daemon's lists takes every key they hold with them, at once, without
      anybody having to find those keys first.

      **A key reaches every sandbox on the host, or only its own.** Its scopes
      say what it may do and its reach (`sandboxes`) says to what: `all`, or
      `own` — the sandboxes and volumes that very key made, and no others,
      whoever its owner is. A key handed to a program that makes sandboxes for
      itself is given `own`, and is then no way into anybody else's.

      **A program on a person's machine asks that person for its key**, rather
      than being pasted one. This is OAuth's authorization code with PKCE and
      a loopback redirect (RFC 7636, RFC 8252):

      1. The program makes a random `code_verifier`, listens on a port of its
         own loopback, and opens the person's browser at
         `GET /console/authorize`, saying what it wants and the
         `code_challenge` that is the verifier's SHA-256.
      2. The person, signed in, reads what is asked and approves it or does
         not. Approving is `POST /v1/keys/authorizations`, called by the page
         as them: nothing is minted, and a code comes back.
      3. The page sends the browser to the program's `redirect_uri` with the
         code — or shows it, for the person to paste, when the program gave
         no address.
      4. The program trades the code and its verifier for the key at
         `POST /v1/keys/authorizations/redeem`, which mints it then.

      The key is the approver's own, and can never do more than they may. A
      program that is done with it revokes it: `DELETE /v1/keys/{keyId}`
      takes a key's own id from that very key, whatever its scopes.
  - name: Auth
    description: |
      Who is calling. A program calls with a key; a person signs in to the
      console with Google and is given a session, which is a cookie the
      browser sends and nothing else can.

      **Who may sign in, and what they may do, is this daemon's
      configuration and not something the API changes.** Its administrators
      are named on its command line and hold every scope; the other people
      it lets in hold the scopes it gives them. There is no route that
      makes somebody an administrator, for the reason there is none that
      mints a first key: an API that can grant its own highest privilege
      has an unauthenticated way to it somewhere.

      What a daemon knows of the people who signed in, their sessions and
      their keys is in a PostgreSQL database rather than on its host, so
      that several daemons in front of one database are one control plane:
      a sign-in started on one may finish on another, and a key revoked on
      one is refused by all of them.

paths:
  /:
    get:
      operationId: getRoot
      tags: [Meta]
      security: []
      summary: Go to the console
      description: >-
        A redirect to `/console`, so that a person handed this daemon's address
        and nothing else lands somewhere rather than on a `404`.


        **Only the root.** Any other unrouted path is a `404`, because a path the
        contract does not describe is a path spelled wrong, and a redirect
        answering one would hide it behind a page that looks like it worked.
      responses:
        "302":
          description: The console is at `/console`.
          headers:
            Location:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"

  /console:
    get:
      operationId: getConsole
      tags: [Meta]
      security: []
      summary: The console
      description: |
        An operator's view of this host: what it is, what it can do, the
        sandboxes on it and the images cached for them.

        **One page, with everything in it.** The script, the stylesheet and the
        fonts are inlined, for the reason `/v1/docs` is — this daemon runs on
        the host that boots untrusted microVMs, which is the last host that
        should be reaching a CDN, and a console that fetched a chunk from one
        would be a blank screen exactly where it is needed. It is also why
        there is no static asset plane here: a wildcard file route is a path
        traversal waiting to be written, on the one service whose whole job is
        isolation.

        **Unauthenticated, like the reference, and for the same reason.** The
        page is bytes; every call it makes carries the session of the person
        signed in to it, or a key they typed into it, and each of those
        routes answers `401` without one.


        **Never in a frame.** Every address of the console is answered with
        `X-Frame-Options: DENY` and `Content-Security-Policy: frame-ancestors
        'none'`: the page acts as whoever is signed in to it, on a click, and
        a page that could frame it — a tunnel on a neighbouring host serves
        whatever a sandbox does — could have that click made for it.


        **Its pages have addresses of their own**, below, and each answers with
        these same bytes, so a person can reload, bookmark or share any of
        them. They are named rather than a wildcard: the page decides what to
        show from the address, and the daemon serves nothing but this one page
        at any of them.
      parameters:
        - name: signInError
          in: query
          description: >-
            Why a sign-in came back without a session, for the page to say.
            Set by `GET /v1/auth/google/callback`; the page is the same bytes
            with it or without.
          schema: { $ref: "#/components/schemas/SignInError" }
      responses:
        "200":
          description: The console.
          content:
            text/html:
              schema: { type: string, format: binary }

  /console/{page}:
    parameters:
      - name: page
        in: path
        required: true
        schema:
          type: string
          enum: [usage, sandboxes, tunnels, volumes, images, brokers, keys, authorize]
    get:
      operationId: getConsolePage
      tags: [Meta]
      security: []
      summary: One of the console's pages
      description: |
        The console, as `GET /console` answers it: the page reads which of its
        pages to show from the address. A page the console does not have is a
        `404`.

        **`authorize` is where a program sends a person to be given a key**
        (see Keys), and it reads what is asked from its query:

        | parameter | what it says |
        |---|---|
        | `client` | What is asking, in its own words: `ryclaude on ada-laptop`, say. Required, at most 128 characters, and text a person can read (`KeyRequest.name`). The asker's claim, which nothing checks: the page shows it as one, and the key is named it, with its ends trimmed and each run of spaces made one. |
        | `scopes` | The scopes asked for (`Scope`), separated by commas. The person approving must hold every one: the page says which they do not, and offers nothing to approve. |
        | `sandboxes` | Which sandboxes the key is to act on (`KeyReach`). `all`, when left out. |
        | `code_challenge` | `KeyAuthorizationRequest.codeChallenge`. Required. |
        | `redirect_uri` | Where the program listens for the code, as `KeyAuthorizationRequest.redirectUri` takes it: plain HTTP, on this machine's loopback, with a port. |
        | `state` | Handed back to `redirect_uri` as it was given, so that the program can tell the answer to its own question from one somebody else sent to its port. |

        They are the page's and not parameters of this route: the daemon
        reads none of them and answers with the same bytes whatever they
        say, so that what a link asks for is judged in one place, in front of
        the person it is asked of. Signed out, the page signs the person in
        and comes back to this address as it was.

        The page shows who is signed in, what is asking and for what, and
        nothing is minted until the person approves. Approved, it sends the
        browser to `redirect_uri` with `code` and `state`; denied, with
        `error=access_denied` and `state`. Without a `redirect_uri` it shows
        the code instead, for the person to paste into the program.

        **It is not a redirector.** A `redirect_uri` that is not this
        machine's loopback, a `code_challenge` that is not one, or a scope
        this contract does not define, and the page offers nothing to approve
        and sends the browser nowhere — not with a refusal either, since
        where a link says to go is the one thing about it that cannot be
        trusted.
      responses:
        "200":
          description: The console.
          content:
            text/html:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"

  /console/sandboxes/{sandboxId}:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: getConsoleSandbox
      tags: [Meta]
      security: []
      summary: The console, on one sandbox
      description: >-
        The console, as `GET /console` answers it, showing one sandbox. Whether
        that sandbox exists is not checked here: this route has no key, and an
        answer that differed would tell anybody which sandboxes exist. The page
        asks, with the key the person gave it.
      responses:
        "200":
          description: The console.
          content:
            text/html:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/BadRequest"

  /console/sandboxes/{sandboxId}/{tab}:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - name: tab
        in: path
        required: true
        schema:
          type: string
          enum: [brokers, usage, history, processes, ports, network, tunnels, output, terminal]
    get:
      operationId: getConsoleSandboxTab
      tags: [Meta]
      security: []
      summary: The console, on one tab of one sandbox
      description: >-
        As `GET /console/sandboxes/{sandboxId}`, open on one of its tabs. A tab
        the console does not have is a `404`.
      responses:
        "200":
          description: The console.
          content:
            text/html:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /healthz:
    get:
      operationId: health
      tags: [Meta]
      summary: Is this daemon up
      security: []
      description: >-
        Unauthenticated, and it says nothing about the host beyond the fact that
        something answered. What a load balancer probes.
      responses:
        "200":
          description: It is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/openapi.yaml:
    get:
      operationId: getOpenapiYaml
      tags: [Meta]
      security: []
      summary: This document
      description: |
        The bytes of `openapi/sandboxes.yaml`, served by the daemon that
        implements it — a copy embedded in the binary at build time, so a
        deployment ships one file and there is no second copy to drift.

        **Unauthenticated, deliberately**, for the reason `/healthz` is: a
        caller reading a contract has not been issued a key yet, and a document
        already committed to a repository is not a secret. It says which routes
        exist, not who may call them, and every one of them still answers `401`
        without a key.
      responses:
        "200":
          description: The contract.
          content:
            application/yaml:
              schema: { type: string, format: binary }

  /v1/docs:
    get:
      operationId: getDocs
      tags: [Meta]
      security: []
      summary: This document, rendered
      description: |
        The API reference as one self-contained HTML page, built from
        `/v1/openapi.yaml` by Redoc at build time.

        **It loads nothing from any host but this one.** A daemon here runs on
        the machine that boots untrusted microVMs, which is the last host that
        should have egress — and a page that pulls its renderer from a CDN is a
        blank screen on such a host.
      responses:
        "200":
          description: The rendered reference.
          content:
            text/html:
              schema: { type: string, format: binary }

  /v1/ca:
    get:
      operationId: getCA
      tags: [Brokers]
      summary: The certificate authority this host's sandboxes are identified by
      description: |
        The PEM an upstream needs in order to verify the sandboxes calling it.

        This is the other half of the broker plane: an operator declares an
        upstream here, and gives that upstream this certificate. Everything the
        upstream then knows about a caller — which sandbox, on which host —
        comes from the connection rather than from anything the caller sent.

        It is a public certificate and carries no key. What it is NOT is a
        credential: holding it lets somebody verify this host's sandboxes, not
        impersonate one.
      responses:
        "200":
          description: The authority.
          content:
            application/x-pem-file:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}/identity:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: getSandboxIdentity
      tags: [Brokers]
      summary: What this sandbox presents to a brokered upstream
      description: >-
        The certificate's subject, its URI and its fingerprint — never its key,
        which does not leave this daemon and is the reason the sandbox cannot
        present it itself.
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "200":
          description: The identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identity" }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/tunnels:
    get:
      operationId: listHostTunnels
      tags: [Tunnels]
      summary: Every tunnel on this host, and the relay that serves them
      description: |
        Every sandbox's tunnels in one list, with the state of the path a
        visitor takes to reach them: this host's relay, and the gateway it is
        docked at. A tunnel is only as reachable as both.

        **Paged like the other collections**, oldest first by `createdAt` and
        then by `slug`, which no two tunnels share. A position rather than an
        index, so a tunnel deleted before the page boundary does not move it.
        Without `limit` it is every tunnel, which is what a caller that does
        not page has always had. The relay is the same on every page.

        A key that acts only on its `own` sandboxes is listed their tunnels,
        and the same relay.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The relay's state, and a page of the tunnels.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostTunnels" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/brokers:
    get:
      operationId: listBrokers
      tags: [Brokers]
      summary: The shared brokers this host declares
      description: |
        Every broker a spec may name without writing out an upstream.
      responses:
        "200":
          description: The brokers, in name order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/brokers/{brokerName}:
    parameters:
      - $ref: "#/components/parameters/BrokerName"
    get:
      operationId: getBroker
      tags: [Brokers]
      summary: One shared broker
      responses:
        "200":
          description: The broker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Broker" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putBroker
      tags: [Brokers]
      summary: Declare a shared broker, or replace its upstream
      description: |
        By name, and idempotent: the name is what every spec refers to, so it is
        the caller's to choose and a repeat is the same broker.

        **Replacing an upstream moves every sandbox that uses it,** on its next
        connection — that is what "shared" means, and it is why this needs
        `brokers.admin` rather than anything a scheduler holds. Connections
        already open finish where they started. It is also why a key that acts
        only on its `own` sandboxes is refused it, `403`, whatever its scopes:
        the sandboxes it would move are not its own.

        This is the only way to declare one — the daemon has no flag for it,
        so a broker's upstream has one source — and it survives a restart of
        the daemon.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrokerUpstream" }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Broker" }
        "201":
          description: Declared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Broker" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteBroker
      tags: [Brokers]
      summary: Withdraw a shared broker
      description: |
        Refused with `409 broker_in_use` while any sandbox on this host is given
        it, naming them: a broker withdrawn from under a sandbox leaves a port
        inside the machine that answers and goes nowhere, which from inside
        reads as an upstream that is down. Detach it from those sandboxes first.

        Deleting one that is not there succeeds, as every delete here does.

        Refused, `403`, to a key that acts only on its `own` sandboxes, as
        declaring one is: it is every sandbox's broker.
      responses:
        "204":
          description: Gone, or was never here.
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Sandboxes are given it (`broker_in_use`), and the body names them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/counts:
    get:
      operationId: getCounts
      tags: [Meta]
      summary: How many of each thing this host has
      description: |
        How many sandboxes, tunnels, volumes, images and shared brokers there
        are, in one call — what a navigation shows beside each, without
        reading five lists to count them.

        **Each count is answered only to a key that may read what it counts**:
        the images to one holding `images.read`, and the rest to one holding
        `sandboxes.read`, as their lists are. A count the key may not read is
        absent rather than zero, because zero is an answer.
      responses:
        "200":
          description: What the key may count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostCounts" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: A count could not be read, and the message says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/info:
    get:
      operationId: getInfo
      tags: [Meta]
      summary: What this host is and what it can do
      description: |
        Read this before deciding what to ask for. It carries the two things a
        caller otherwise learns from a refusal: whether this host can nest, and
        what its ceilings are.

        There is no `/v1/hosts`. **A daemon IS the boundary** — its own VMs, its
        own image cache, its own nftables tables, its own store. Several run the
        way several of anything do. A collection here is the shape that invites
        a picker, a registry and a scheduler to grow back, and a scheduler over
        several of these is somebody else's program.
      responses:
        "200":
          description: This host.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostInfo" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/host/commitments:
    get:
      operationId: getHostCommitments
      tags: [Meta]
      summary: What this host's sandboxes have been promised
      description: |
        The vCPUs and memory of this host's running sandboxes, and the size
        of its volumes, added up — what the host has promised, as against what
        its sandboxes are using at the moment, which is
        `GET /v1/host/metrics/history`. Set beside the host's own CPUs, memory
        and disk, it says how far this host is committed: past 100% is a host
        that could not give every sandbox what it was promised if they all
        asked at once.

        Refused, `403`, to a key that acts only on its `own` sandboxes: these
        are every sandbox's numbers.

        **CPUs and memory are a running sandbox's**, running as the host's
        history counts it: `creating`, `booting`, `ready`, `unreachable` and
        `paused` — a paused sandbox still holds its memory. **Disk is a
        volume's**, whatever its sandbox is doing and whether a sandbox holds
        it at all, at the size the guest sees rather than what it has written
        so far. A volume not laid down yet counts at the size its sandbox
        asked for, and a size the host's defaults decided is counted as they
        decided it.
      responses:
        "200":
          description: What the host has promised, added up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostCommitments" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: The volumes could not be read, and the message says why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/host/metrics/history:
    get:
      operationId: getHostMetricsHistory
      tags: [Meta]
      summary: What this host has been using
      description: |
        The host's own CPU, memory, load and disk over time, and beside each
        what this host's sandboxes were using of it — so "the host is busy"
        and "the sandboxes are what is keeping it busy" are one read.

        Read with every sandbox, on the same ten-second tick, and kept the
        same way: an hour of the readings as taken and a day of one-minute
        averages, written to the daemon's state directory every minute. The
        time the daemon was not running is absent, never zeroes.

        Refused, `403`, to a key that acts only on its `own` sandboxes: what
        every sandbox on the host is using is not its own to read.

        Everything here is measured on the host — `/proc` and the filesystem
        holding the state directory — and nothing comes from a guest.
      parameters:
        - name: window
          in: query
          description: How far back to go.
          schema:
            $ref: "#/components/schemas/MetricsWindow"
      responses:
        "200":
          description: The readings, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostMetricsHistory" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/images:
    get:
      operationId: listImages
      tags: [Images]
      summary: Every image cached on this host
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The images.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImagePage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: pullImage
      tags: [Images]
      summary: Pull an OCI reference and build the rootfs a VM can boot
      description: |
        **`POST`, where a sandbox is a `PUT`, and the difference is where the id
        comes from.** An image's id is derived from its manifest digest, so this
        is idempotent by content rather than by a name the caller invented: the
        same reference posted twice resolves to the same digest, finds the same
        rootfs and answers `200`. There is nothing here for a lost response to
        duplicate.

        **Asynchronous.** A pull is a registry fetch and a filesystem to write,
        which is minutes for a large image, and a request held open for it is
        one a proxy will cut at a timeout nobody here controls. This answers
        `202` with the image in `pulling`; the caller watches `GET
        /v1/images/{imageId}`.

        **A tag is re-resolved every time.** A tag that was pushed over is new
        content, so it is a new id without anybody asking — the old one stays,
        because a sandbox may be booted from it. That is also why deleting an
        image in use is a `409` rather than a broken machine.

        Calling this is optional. `POST /v1/sandboxes` pulls what it needs,
        and the sandbox sits in `creating` while it does. It is here so a
        deployment can warm the cache before the machine that needs it is
        wanted, which is the difference between a sandbox that starts in seconds
        and one that starts in minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageRequest" }
      responses:
        "202":
          description: Accepted. The image is `pulling`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "200":
          description: >-
            This content is already cached and was built by this extractor.
            Distinct from `202` so a caller can tell a warm cache from a pull it
            started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >-
            The reference does not parse, or names a registry this daemon has no
            credential for. Refused here rather than as an image that goes
            `failed` a minute later.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "507":
          description: >-
            There is not enough room on this host for the rootfs this image
            would build.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/ImageID"
    get:
      operationId: getImage
      tags: [Images]
      summary: Whether this image is ready, and why it is not
      responses:
        "200":
          description: The image.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteImage
      tags: [Images]
      summary: Drop a cached rootfs
      description: >-
        Idempotent: deleting one that is already gone succeeds, because a caller
        cleaning up after a crash cannot tell "already gone" from "never
        existed".


        A `failed` image is kept rather than cleaned up, with its reason
        attached — an image that vanishes when it fails is a pull nobody can
        diagnose — so this is how one is cleared.
      responses:
        "204":
          description: Gone, or was already.
        "409":
          description: >-
            A sandbox is booted from it. The body names them, because "in use"
            without saying by what is a refusal a caller cannot act on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/volumes:
    get:
      operationId: listVolumes
      tags: [Volumes]
      summary: Every volume on this host
      description: >-
        Including the ones a sandbox is using, with its id, because the
        question a list answers is usually "can I delete this" — and the one it
        answers next is "then what is holding it".


        A key that acts only on its `own` sandboxes is listed the volumes it
        made, and told which sandbox holds one only when that sandbox is its
        own too.
      responses:
        "200":
          description: The volumes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/volumes/{volumeName}:
    parameters:
      - $ref: "#/components/parameters/VolumeName"
    delete:
      operationId: deleteVolume
      tags: [Volumes]
      summary: Let a volume go, and what was written on it
      description: >-
        The one way a volume is reclaimed that does not also drop a sandbox —
        `DELETE /v1/sandboxes/{id}?disk=delete` does it too, for the volume
        that sandbox holds.


        Idempotent: deleting one that is already gone succeeds, because a
        caller cleaning up after a crash cannot tell "already gone" from "never
        existed".


        A key that acts only on its `own` sandboxes drops only volumes it
        made. One that is somebody else's is answered as a name no volume has
        — `204`, and it is still there.
      responses:
        "204":
          description: Gone, or was already.
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: >-
            A sandbox holds it — stopped and failed ones included, since either
            can be started again. The body names it: drop that sandbox first.
            It is not named to a key that acts only on its `own` sandboxes
            when the sandbox is not one of them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes:
    get:
      operationId: listSandboxes
      tags: [Sandboxes]
      summary: Every sandbox on this host
      description: >-
        **An unreachable sandbox is listed, with the error that says why.** Not
        omitted: one missing from a list is indistinguishable from one that was
        never created, and those need opposite fixes.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: state
          in: query
          description: Only sandboxes in this state. Repeat for several.
          schema: { $ref: "#/components/schemas/SandboxState" }
        - name: label
          in: query
          description: >-
            Only sandboxes carrying this label, written `key=value`. Repeat to
            require several; they are ANDed, because a filter that ORs silently
            returns more than was asked for.
          schema:
            type: array
            items: { type: string }
          explode: true
          example: ["owner=runyard", "session=1234"]
        - name: q
          in: query
          description: >-
            Only sandboxes whose `labels.name`, id or image contains this,
            ignoring case: what a person types to find one. ANDed with the
            other filters, and applied before the page is cut, so a page is
            of what matched rather than a page of everything filtered after.
          schema: { type: string, maxLength: 200 }
          example: review
      responses:
        "200":
          description: The sandboxes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxPage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSandbox
      tags: [Sandboxes]
      summary: Create a sandbox, or return the one this key already made
      description: |
        **The id is minted here**, a UUID, and it is new for every sandbox this
        host ever makes. What a person calls the machine goes in
        `spec.labels.name`, which is a label like any other: not unique, and
        never interpreted.

        **Asynchronous, and it has to be.** There is an image to have, a disk to
        make, a network namespace to make with a ruleset and a TAP in it, a
        kernel to boot and a guest to wait for. So this answers `202` at once with the sandbox in
        `creating`, and the caller watches `GET /v1/sandboxes/{sandboxId}` or
        reads `GET /v1/sandboxes/{sandboxId}/events`.

        **Idempotent by `Idempotency-Key`.** A repeat with the same key and the
        same spec returns `200` and the sandbox the first request made, whatever
        state it is in. A repeat with a DIFFERENT spec is a `409` rather than a
        second machine or a reconfiguration of the first. A key whose sandbox has
        since been dropped is also a `409`, for a day after the drop: a retry
        that arrives that late is a caller that does not know its machine is
        gone, and quietly making it another one is the failure the key exists to
        prevent.

        **The image is resolved before this answers.** `spec.image` that does
        not parse is a `400` and one this host cannot pull is a `422`, here,
        while the caller still has the request — not a machine that goes
        `failed` half a minute later for a reason found in an event stream.
        Whether the rootfs is already cached is not part of that: a cache miss
        is a sandbox that sits in `creating` for longer, and `GET
        /v1/sandboxes/{id}/events` says so while it does.

        **A spec this host cannot satisfy is a `422`.** `nested: true` on a host
        without nested virtualisation is the one that matters — the alternative
        is a guest that sees the CPU extension, finds no `/dev/kvm` and fails at
        whatever the workload does with it, which is the most confusing shape
        this failure has. `GET /v1/info` says in advance.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            The caller's own, and required: a create without one is a create a
            lost response turns into two machines. Scoped to the API key that
            sends it, so two callers cannot collide on one.

            One per machine the caller means to make — a fresh random value per
            create, reused only when retrying that same create.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[\\x21-\\x7e]+$"
          example: 0192f7a4-5b1e-7c3d-9a2f-4e6b8c1d0a53
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SandboxSpec" }
      responses:
        "202":
          description: Accepted. The sandbox is `creating`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "200":
          description: >-
            This key already made a sandbox, with this spec, and this is it.
            Distinct from `202` so a caller can tell a retry that was absorbed
            from one that started a machine.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >-
            This key already made a sandbox with a different spec, or made one
            that has since been dropped — refused rather than reconciled. Or
            `volume_in_use`: another sandbox holds the volume this one names,
            and the body says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >-
            The spec is well-formed and this host cannot satisfy it: an image it
            cannot pull, `nested` it cannot give.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "507":
          description: >-
            This host's sandbox quota, its memory, or the filesystem holding the
            disks refuses another one. The body says which, because "try again
            later" and "you are at your limit" are different sentences to act
            on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: getSandbox
      tags: [Sandboxes]
      summary: What state this sandbox is in
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "200":
          description: The sandbox.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteSandbox
      tags: [Sandboxes]
      summary: Stop it, take its interface away, and let it go
      description: |
        The machine is powered down, its network namespace — its TAP, its
        rules and its resolver with it — is removed, and the disk is disposed
        of as `disk=` says.

        **The namespace is torn down with the machine, and a failure to tear it
        down is a failure of this call.** A namespace that outlives its sandbox
        holds an address this host still routes to, waiting to be handed to the
        next sandbox that draws the same /30.

        **`disk=keep` is the default, and the default is the conservative one.**
        The disk is everything the workload installed, wrote and broke; it
        outlives the sandbox by design, and a caller that means to reclaim the
        space says so.

        **A kept disk is a free volume.** It stays in `GET /v1/volumes`, let
        go for the next sandbox that names it in `spec.disk.volume`, until
        `DELETE /v1/volumes/{name}` lets it go. It holds what the workload
        changed and not the image under it — files it wrote, and for each one
        it deleted, a marker saying so.

        `disk=delete` deletes the volume: it is this sandbox's disk, and the
        parameter means what it says about it.

        Idempotent: deleting one that is already gone succeeds — except to a
        key that acts only on its `own` sandboxes, which is answered `404` for
        every sandbox that is not its own, one that is gone among them.
      parameters:
        - name: disk
          in: query
          description: What to do with the sandbox's disk.
          schema:
            type: string
            enum: [keep, delete]
            default: keep
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "204":
          description: Gone, or was already.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}/stop:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    post:
      operationId: stopSandbox
      tags: [Sandboxes]
      summary: Shut the machine down, keep the disk and the id
      description: |
        A clean shutdown: the guest is asked to power off and given a grace
        period before it is killed, so this is a power-down and not a power cut.
        A wedged guest must not be able to hold a sandbox open, so the grace
        period has a ceiling and this always finishes.

        A paused sandbox is resumed first, so that it can hear the request to
        power off, and goes down as cleanly as a running one.

        Distinct from `DELETE` because the sandbox, its id, its spec and its
        disk all survive — `POST /start` brings the same machine back with what
        it wrote. That is what makes a sandbox something a host can park
        overnight.
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "202":
          description: Stopping.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}/start:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    post:
      operationId: startSandbox
      tags: [Sandboxes]
      summary: Boot a stopped sandbox again
      description: >-
        The same disk, the same spec, the same id, the same network namespace
        with its policy stated again. Processes do not come back — a process is a process, and the
        machine it was in was switched off. What comes back is the filesystem.
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "202":
          description: Booting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The sandbox is not stopped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}/pause:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    post:
      operationId: pauseSandbox
      tags: [Sandboxes]
      summary: Freeze a running machine where it is
      description: |
        The machine's vCPUs are stopped, and everything else is kept: its
        memory, its processes, its open files and connections, its interface
        and its rules. Nothing inside it runs, so it costs this host no CPU; it
        still holds its memory, which is the difference from `POST /stop` — a
        stopped machine keeps only its disk, and a resumed one carries on from
        the instruction it was on.

        Synchronous: when this answers, the machine is paused. A sandbox
        already paused is answered as it is, so a retry of a pause whose answer
        was lost is told it worked.

        While it is paused nothing is sent to its agent — commands, files,
        processes, terminals, its metrics from inside, a broker attached — and
        each of those answers `409` at once rather than waiting for as long as
        the pause lasts. Its egress can still be changed, being the host's.
        Connections are kept on the machine's side only: a peer that gives up
        on a silent connection has given up, and the workload finds that out
        when it is resumed. It stays paused across a restart of the daemon
        that leaves it running; one that powers it off loses its memory, and
        it comes back `stopped`.
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "200":
          description: Paused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The sandbox is not running — it is on its way up, stopped, or
            failed — or it was stopped while it was being paused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The hypervisor would not pause it; the message is what it said.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/sandboxes/{sandboxId}/resume:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    post:
      operationId: resumeSandbox
      tags: [Sandboxes]
      summary: Set a paused machine going again
      description: >-
        From where it stopped: the same processes, the same memory, the same
        connections. Synchronous, and a sandbox already running is answered as
        it is. The guest's clock is the host's when it resumes, not the time
        it was paused at.
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "200":
          description: Running again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sandbox" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The sandbox is not paused, or it was stopped while it was being
            resumed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The hypervisor would not resume it; the message is what it said.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/sandboxes/{sandboxId}/labels:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    put:
      operationId: setSandboxLabels
      tags: [Sandboxes]
      summary: Replace this sandbox's labels
      description: >-
        The set, not a delta. `spec.labels` is what it was created with and
        stays as it was; this is what is true now, and what `?label=` matches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labels]
              properties:
                labels:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "204":
          description: Set.
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}/events:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: streamSandboxEvents
      tags: [Sandboxes]
      summary: What has happened to this machine, from a cursor
      description: |
        A chunked `application/x-ndjson` body, one envelope per line, in
        sequence order. This is where the sentence explaining a `failed` lives,
        and it is the reason the stream exists at all: a state field says a
        machine did not come up, and this says the kernel panicked mounting its
        root filesystem.

        It is also the sandbox's operation log. Every call that changed it is
        an `operation` event, in the same sequence as what the daemon did
        about it, so "who stopped this, and when" and "what it did next" are
        one read.

        `?from=` names the last sequence the caller committed. A cursor behind
        the retained window is a `409` carrying that window, never a silent
        advance — a gap the caller cannot see becomes a history of a machine
        that never happened.
      parameters:
        - $ref: "#/components/parameters/FromSeqQuery"
        - $ref: "#/components/parameters/FollowQuery"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "200":
          description: The events.
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/SandboxEvent" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Gapped"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}/console:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: getSandboxConsole
      tags: [Sandboxes]
      summary: The guest's serial console, as bytes
      description: |
        Everything the kernel and the guest's init wrote to the console, capped
        at this host's limit and truncated from the front when it is hit.

        **Separate from the event stream and not merged into it.** An event is
        this daemon's account of what it did; this is the guest's account of
        what happened to it, and it is untrusted output from a machine running
        somebody else's code. Rendering the two in one list invites a workload
        to write something that reads like a state transition.

        It is also the only thing there is when a sandbox never reaches `ready`:
        no guest agent means no exec, no files, and no metrics, and the console
        is the whole diagnosis.
      parameters:
        - $ref: "#/components/parameters/FollowQuery"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "200":
          description: The console bytes.
          content:
            text/plain:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}/brokers:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: listSandboxBrokers
      tags: [Brokers]
      summary: The brokers this sandbox has, and the port each is on
      description: >-
        The same list as `sandbox.brokers`, on its own path so a caller watching
        what a machine can reach does not re-read the whole machine.
      responses:
        "200":
          description: Its brokers, by port.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxBrokerPage" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/sandboxes/{sandboxId}/brokers/{brokerName}:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/BrokerName"
    put:
      operationId: attachSandboxBroker
      tags: [Brokers]
      summary: Give a sandbox a broker, while it runs
      description: |
        With no `upstream`, gives it the SHARED broker of that name. With one,
        gives it a one-off broker only this sandbox can reach.

        A name a caller is serving as a client broker is that caller's while
        it does, and is refused here (`conflict`).

        Synchronous, like `PUT .../egress`: a `200` means the port is open
        inside the machine and `/run/runyard/brokers.json` names it. A broker
        this sandbox already has keeps its port, so re-attaching one to change
        its upstream does not move anything a workload has already read.

        On a sandbox that is not running this changes the spec and nothing
        else, and the next boot opens the port. `network.write`, for the reason
        `PUT .../egress` needs it: this widens what an untrusted workload may
        reach.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SandboxBrokerAttach" }
      responses:
        "200":
          description: Attached, and open if the machine is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxBroker" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StillBooting"
        "422":
          description: >-
            No shared broker has that name (`unsupported_spec`), so there is
            nothing to give it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: detachSandboxBroker
      tags: [Brokers]
      summary: Take a broker away from a sandbox
      description: |
        The port closes inside the machine, the published files stop naming it,
        and every connection it was carrying is cut — a sandbox that has lost a
        broker must not keep a connection it opened through it.

        Detaching one it does not have succeeds.
      responses:
        "204":
          description: Detached.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StillBooting"
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/sandboxes/{sandboxId}/brokers/{brokerName}/serve:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/BrokerName"
    get:
      operationId: serveSandboxBroker
      tags: [Brokers]
      summary: Give a sandbox a broker this caller serves, over a WebSocket
      description: |
        Gives the sandbox a broker of this name and makes the caller its far
        end, in one act: a port opens inside the machine,
        `/run/runyard/brokers.json` names it, and every connection the
        workload makes to it arrives here, where what the caller writes back
        is what the workload reads. It lasts as long as the WebSocket does.
        When that ends — the caller closed it, or stopped answering — every
        connection it was carrying is cut, the port closes and the published
        files stop naming it: the broker is gone, as one detached is.

        Nothing of it is written into the sandbox's spec, and nothing is kept:
        a broker of this kind is its caller's connection, and a caller that
        wants it back serves it again.

        **The port** is chosen when the WebSocket is accepted, and said in
        the answer's `Runyard-Broker-Port`. It is also in the sandbox's list
        of brokers for as long as the broker lasts.

        **The frames.** Binary frames only, and together they are one
        [yamux](https://github.com/hashicorp/yamux/blob/master/spec.md)
        session, version 0. This daemon is the yamux client — the streams it
        opens have odd ids — and the caller is the yamux server, which accepts
        them and opens none. A stream is one connection from the workload,
        carrying its bytes unmodified in both directions, from the first byte
        it sent; closing one half of a stream is the workload, or the caller,
        having finished writing. The session's own keepalives are how each
        side learns the other is gone, so a caller that stops answering them
        is hung up on within seconds.

        What a caller owes the session, and what happens when it does not:

        - It opens no stream. One that does is hung up on, with status `1008`.
        - It accepts the streams it is sent. At most 256 wait to be accepted,
          and 256 connections more wait their turn to be sent; one made past
          that is closed if no place comes free within the time an upstream
          is given to answer a dial, fifteen seconds. A stream still not
          accepted after 75 seconds ends the serve.
        - A stream one side has finished writing on is closed altogether five
          minutes later, whatever the other side still had to say. An answer
          that takes longer than that is one to a request whose sender kept
          its half open, as an HTTP client does.

        **A name is one broker's.** A sandbox that already has a broker of
        this name — shared, one-off, or one another caller is serving — is
        refused (`conflict`). A caller serving it is first asked whether it is
        still there, and only one that answers keeps the name: a caller that
        has gone, or that serves again the moment it closed its own
        WebSocket, is not refused for a session that is over.

        **Only a running sandbox.** The port is the machine's, so there is
        nothing to give one that is not `ready`, and the serve ends when the
        sandbox is paused, stopped or deleted, and when this daemon stops. A
        daemon that ends it closes the WebSocket with status `1001`, going
        away.

        Everything that refuses does so before the WebSocket is accepted, as
        an ordinary answer, and in this order: a name no broker could have,
        no such sandbox, a sandbox that is not running, a request that is not
        this handshake or does not offer `runyard.broker.v1`, a name the
        sandbox already has.

        **The key** is offered as it is to a terminal: in `Authorization`, or
        as the subprotocol `runyard.bearer.<key>` beside `runyard.broker.v1`,
        of which only `runyard.broker.v1` is echoed back.

        `network.write`, because this is choosing where a sandbox's
        connections go, as attaching a one-off broker is.
      responses:
        "101":
          description: >-
            Switched to a WebSocket: the sandbox has the broker, and this
            caller is who serves it.
          headers:
            Runyard-Broker-Port:
              description: The port on `127.0.0.1` inside the sandbox.
              schema: { type: integer }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The sandbox is not running, or it already has a broker of that
            name (`conflict`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/sandboxes/{sandboxId}/terminal:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: openTerminal
      tags: [Exec]
      summary: An interactive shell, over a WebSocket
      description: |
        A process inside the sandbox with a PTY on its standard streams, for a
        person at a keyboard. It is a shell unless `argv` says otherwise, and it
        ends when the WebSocket does: the process group is sent `SIGHUP`, which
        is what closing a terminal has always meant.

        **The frames.** Binary frames are the terminal's bytes, in both
        directions, unmodified. Text frames are control, as JSON:

        - from the caller, `{"type":"resize","cols":120,"rows":40}`;
        - from this daemon, `{"type":"exit","exitCode":0}` once, just before it
          closes the socket, so a closed terminal can say whether what ran in
          it succeeded.

        **The key.** A browser cannot set `Authorization` on a WebSocket, so the
        key may instead be offered as a subprotocol,
        `runyard.bearer.<key>`, beside `runyard.terminal.v1`. Only
        `runyard.terminal.v1` is echoed back, so the key does not return in the
        response. It is never taken from the query string, which is the part
        of a URL that ends up in logs.

        `exec`, because it IS exec: whatever is typed runs inside the sandbox
        as the user it names.
      parameters:
        - name: cols
          in: query
          description: The terminal's width to start with. A `resize` changes it.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 80 }
        - name: rows
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 24 }
        - name: argv
          in: query
          description: >-
            What to run instead of a shell, one element per repetition —
            `?argv=top&argv=-d&argv=1`. Absent runs `/bin/bash` if the image has
            it and `/bin/sh` otherwise, as a login shell.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: user
          in: query
          description: >-
            Who to run as, `name` or `uid:gid`. Absent is the image's own
            `USER`, as for every other process.
          schema: { type: string }
      responses:
        "101":
          description: >-
            Switched to a WebSocket. Everything from here on is frames, as
            described above.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The sandbox is not running, or is paused (`conflict`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/sandboxes/{sandboxId}/metrics:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: getSandboxMetrics
      tags: [Sandboxes]
      summary: What the machine is using
      description: |
        Two halves, and which side of the wire each comes from is the whole
        reading of this object.

        `host` is measured here — the hypervisor process's memory, the disk
        file's allocated bytes, the packets the TAP carried. It is true.

        `guest` is what the workload says about itself, passed through whole,
        and **nothing may be decided from it.** A sandbox is a machine running
        somebody else's code and it can say whatever it likes about its own
        free memory. It is here because it is what a person debugging needs and
        absent while the sandbox is not `ready`. The console marks every
        figure of it as the guest's.
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "200":
          description: The metrics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxMetrics" }
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}/metrics/history:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: getSandboxMetricsHistory
      tags: [Sandboxes]
      summary: What the machine has been using
      description: |
        The readings behind `GET .../metrics`, over time. The daemon reads every
        running sandbox every ten seconds and keeps an hour of those, and a day
        of one-minute averages.

        The same two halves, for the same reason: `host` was measured here and
        `guest` is what the workload said. A point has no `guest` when the
        agent did not answer.

        A stopped sandbox keeps what it had, and the time it was stopped is
        simply absent — never zeroes, which would read as a machine that was
        running and idle. Readings are written to the daemon's state directory
        every minute, so a restart loses at most that.
      parameters:
        - name: window
          in: query
          description: How far back to go.
          schema:
            $ref: "#/components/schemas/MetricsWindow"
      responses:
        "200":
          description: The readings, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxMetricsHistory" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}/system/processes:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: listSystemProcesses
      tags: [System]
      summary: Every process running in the machine
      description: |
        The whole process table, kernel threads included and marked, in pid
        order — not only what was started through this API, which is
        `GET .../processes`.

        The guest's own account, read by its agent from its `/proc`: whatever
        runs as root in the sandbox can make it say anything, and nothing may
        be decided from it. The console marks it so.

        CPU is measured over a short window inside the request (`sampledMs`),
        so this takes a moment to answer, and two callers polling at different
        rates cannot move each other's numbers.

        Capped rather than paged: a process table between one page and the
        next is a different machine, so a second page would be half of a
        different answer. `truncated` says the cap was reached and `total` how
        many there were.
      responses:
        "200":
          description: The process table.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxProcessTable" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The sandbox is not running (`conflict`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/sandboxes/{sandboxId}/system/sockets:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: listSystemSockets
      tags: [System]
      summary: Every TCP and UDP socket open in the machine
      description: |
        Listening and connected alike, IPv4 and IPv6, each with the process
        holding it where the agent could find one. Sorted by protocol, then
        local port.

        The guest's own account, read by its agent from its `/proc`: whatever
        runs as root in the sandbox can make it say anything, and nothing may
        be decided from it. The console marks it so.

        A socket with no process is one whose owner the agent could not see —
        one already closed and waiting out `TIME_WAIT` has none — rather than
        one the kernel holds for nobody.

        Brokered connections show here as what they are inside the guest: a
        client connected to the broker's loopback port, which the agent holds.
      responses:
        "200":
          description: The socket table.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxSocketTable" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The sandbox is not running (`conflict`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/sandboxes/{sandboxId}/egress:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: getSandboxEgress
      tags: [Network]
      summary: What this sandbox may reach, what it has open, and what it tried and could not
      description: |
        **The refusals are the reason this route is a `GET` and not just a
        field on the sandbox.** A deny-by-default network whose denials are
        invisible is a network that gets turned off: the workload sees a
        connection that hangs, the person debugging sees a sandbox that "has no
        internet", and the fastest way out of that is to stop filtering. So the
        last refusals are kept, with the name or address that was asked for, and
        a caller can turn one into a rule without guessing.

        Capped, never paged. A page sequence over a moving ring buffer is two
        half-truths a caller would be invited to add together; `truncated` says
        the answer was cut instead.
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "200":
          description: The live policy, the rules and pins it is enforced by, the connections it let through, and the recent refusals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressStatus" }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: setSandboxEgress
      tags: [Network]
      summary: Replace every egress rule at once
      description: |
        The set, not a delta: the rules sent are the rules the sandbox will
        have, and a rule not in them is removed. To add or remove one rule
        without restating the others, use `.../egress/rules/{ruleName}`.

        A name still allowed afterwards — by whichever rule — keeps what it has
        pinned, so rewriting the policy does not cut a transfer running
        through it.

        **Synchronous, where creating a sandbox is not.** A `204` means the
        kernel IS enforcing that set rather than that it has been asked to. A
        ruleset the kernel will not take is a `422` with **nothing changed**,
        so this document and the host cannot disagree about what is open.

        Idempotent. Sending the set a sandbox already has succeeds and changes
        nothing.

        **This is a host operation and nothing inside the sandbox can reach
        it.** The workload has no route to its own policy; if it did, "locked by
        default" would mean "locked until the untrusted code asks nicely".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EgressSpec" }
      responses:
        "204":
          description: The kernel is enforcing that set.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EgressNotChangeable"
        "422":
          $ref: "#/components/responses/EgressNotInstallable"
  /v1/sandboxes/{sandboxId}/egress/rules:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: listEgressRules
      tags: [Network]
      summary: List a sandbox's egress rules
      description: |
        The rules as they were written, in the order they were added. The same
        list as `policy.rules` in `GET .../egress`, without the kernel's side
        of it — which is what a caller about to change one wants to read.

        Readable in every state: a stopped sandbox's rules are the ones it
        boots with.
      responses:
        "200":
          description: Every rule, in the order they were added.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/EgressRule" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/sandboxes/{sandboxId}/egress/rules/{ruleName}:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/RuleName"
    get:
      operationId: getEgressRule
      tags: [Network]
      summary: Read one egress rule
      responses:
        "200":
          description: The rule, as it was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressRule" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No sandbox with this id, or no rule by this name on it. The message says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      operationId: putEgressRule
      tags: [Network]
      summary: Add a rule, or replace the one with this name
      description: |
        The rule's name is its identity, and the caller's to choose:
        `github-ssh`, `npm-registry`. Sending the same rule again changes
        nothing, so a retry after a dropped connection is safe — there is no
        second rule to clean up.

        Every other rule is left as it is. A name this rule allowed that
        another rule still allows keeps its pins, on that rule's ports; one
        that nothing allows any more has its pins revoked with the change,
        and the connections already open through them go on.

        **Synchronous**, as `PUT .../egress` is: the answer comes once the
        kernel is enforcing the rule, or with **nothing changed**.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EgressRuleSpec" }
      responses:
        "200":
          description: The rule by this name was replaced, and this is it now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressRule" }
        "201":
          description: The rule was added, and this is it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressRule" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EgressNotChangeable"
        "422":
          $ref: "#/components/responses/EgressNotInstallable"
    delete:
      operationId: deleteEgressRule
      tags: [Network]
      summary: Remove one egress rule
      description: |
        What only this rule allowed is closed with it: its ranges at once, and
        the addresses its names were pinned to. A name another rule also
        allows stays resolvable, and open on that rule's ports. Connections
        already open go on — the kernel judges a connection when it starts.

        A rule that is not there is a `404`, so a caller that removes the
        wrong name is told rather than answered with the success it hoped for.
      responses:
        "204":
          description: The rule is gone, and the kernel is enforcing the rules that are left.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No sandbox with this id, or no rule by this name on it. The message says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          $ref: "#/components/responses/EgressNotChangeable"
        "422":
          $ref: "#/components/responses/EgressNotInstallable"
  /v1/sandboxes/{sandboxId}/egress/rules/{ruleName}/pause:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/RuleName"
    post:
      operationId: pauseEgressRule
      tags: [Network]
      summary: Pause one egress rule, keeping it
      description: |
        What only this rule opens is closed, as a delete would close it —
        its ranges at once, the addresses its names were pinned to — and the
        rule stays, as it was written, to be resumed rather than written
        again. A name another rule also allows stays open on that rule's
        ports. Connections already open go on.

        A rule already paused is answered as it is, so a retry of a pause
        whose answer was lost is told it worked. **Synchronous**, as every
        change to a sandbox's rules is: the answer comes once the kernel has
        stopped enforcing it, or with nothing changed.
      responses:
        "200":
          description: The rule is paused, and this is it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressRule" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No sandbox with this id, or no rule by this name on it. The message says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          $ref: "#/components/responses/EgressNotChangeable"
        "422":
          $ref: "#/components/responses/EgressNotInstallable"
  /v1/sandboxes/{sandboxId}/egress/rules/{ruleName}/resume:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/RuleName"
    post:
      operationId: resumeEgressRule
      tags: [Network]
      summary: Resume a paused egress rule
      description: |
        The rule opens what it did before it was paused: its ranges at once,
        and its names as the sandbox next resolves them — what they were
        pinned to was revoked with the pause, and an address is opened for
        the answer the workload is actually given.

        A rule that is not paused is answered as it is. **Synchronous**: the
        answer comes once the kernel is enforcing the rule again, or with
        nothing changed.
      responses:
        "200":
          description: The rule is in force, and this is it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressRule" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No sandbox with this id, or no rule by this name on it. The message says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          $ref: "#/components/responses/EgressNotChangeable"
        "422":
          $ref: "#/components/responses/EgressNotInstallable"
  /v1/sandboxes/{sandboxId}/egress/connections/kill:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    post:
      operationId: killConnections
      tags: [Network]
      summary: Kill connections a sandbox has open
      description: |
        Ends the connections this sandbox has open that match: every one to
        a `destination`, or the one from a `source` port, as
        `GET .../egress` lists them in `connections`.

        Taking a rule away does not end what it let through — the kernel
        judges a connection when it starts — so this is the other half of
        closing something: pause or delete the rule, then kill what is open.
        Killing alone ends what is open now, and a rule that still allows
        the destination lets the workload connect again.

        What is killed is forgotten by the kernel, and for the next two
        minutes its packets are refused before anything that would carry it
        on: the workload's next TCP segment on it is answered with a reset,
        so it is told at once rather than left retransmitting into silence,
        and a UDP datagram on it is dropped. A new connection — a SYN alone,
        even from the same port — is judged by the rules as any other. The
        far end's next packet reaches no connection here either: the
        sandbox's namespace has forgotten it, and so has this host, which no
        longer translates it for the sandbox and answers it as it answers
        anything it has no socket for.

        What matches is what was open when this was asked. Nothing open that
        matches is `200` with nothing killed, so a retry is told there was
        nothing left.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KillConnections" }
      responses:
        "200":
          description: What was killed, as it was listed a moment before.
          content:
            application/json:
              schema:
                type: object
                required: [killed]
                properties:
                  killed:
                    type: array
                    items: { $ref: "#/components/schemas/Connection" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >-
            This sandbox has no interface, so it has no connections, or the
            kernel refused what killing them needs. The message says which;
            one that could not be forgotten says so, and was still refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/sandboxes/{sandboxId}/tunnels:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: listTunnels
      tags: [Tunnels]
      summary: List a sandbox's tunnels
      description: |
        Every tunnel this sandbox has, in the order they were made, each with
        whether it is being served right now and why not.

        Readable in every state: a stopped sandbox's tunnels are the ones it
        serves again when it starts.
      responses:
        "200":
          description: Every tunnel, in the order they were made.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Tunnel" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/sandboxes/{sandboxId}/tunnels/{tunnelName}:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/TunnelName"
    get:
      operationId: getTunnel
      tags: [Tunnels]
      summary: Read one tunnel
      responses:
        "200":
          description: The tunnel, and whether it is being served.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tunnel" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NoSuchTunnel"
    put:
      operationId: putTunnel
      tags: [Tunnels]
      summary: Make a tunnel, or replace the one with this name
      description: |
        A tunnel publishes one TCP port of this sandbox at a public address
        the gateway serves, to the people and tokens its `access` names and to
        nobody else. The name is its identity and the caller's to choose;
        sending the same tunnel again changes nothing, so a retry after a
        dropped connection is safe.

        **Its address is minted with it, and never reused.** A tunnel made
        under a name that was deleted before gets a new one, so a link to the
        last tunnel reaches nothing rather than whatever was published next
        under that name. Replacing a tunnel keeps its address, and its tokens.

        Replacing a tunnel whose port changes ends the connections open
        through it. One that changes only who may reach it does not end them:
        what a visitor was let in for is judged when they arrive.

        Allowed in any state but `gone`: a stopped sandbox's tunnel is served
        when it starts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TunnelSpec" }
      responses:
        "200":
          description: The tunnel by this name was replaced, and this is it now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tunnel" }
        "201":
          description: The tunnel was made, and this is it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tunnel" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/TunnelNotKept"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The sandbox is `gone`, or already has as many tunnels as a sandbox may.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteTunnel
      tags: [Tunnels]
      summary: Delete a tunnel
      description: |
        Its address stops resolving, the connections open through it are
        ended, and its tokens open nothing. Its address is not given to any
        later tunnel.
      responses:
        "204":
          description: The tunnel is gone.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/TunnelNotKept"
        "404":
          $ref: "#/components/responses/NoSuchTunnel"
  /v1/sandboxes/{sandboxId}/tunnels/{tunnelName}/pause:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/TunnelName"
    post:
      operationId: pauseTunnel
      tags: [Tunnels]
      summary: Stop serving a tunnel, keeping it
      description: |
        Its address stops resolving and the connections open through it are
        ended, as a delete would — and the tunnel, its address and its tokens
        are kept, to be resumed rather than made again. A tunnel already
        paused is answered as it is.
      responses:
        "200":
          description: The tunnel is paused, and this is it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tunnel" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/TunnelNotKept"
        "404":
          $ref: "#/components/responses/NoSuchTunnel"
  /v1/sandboxes/{sandboxId}/tunnels/{tunnelName}/resume:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/TunnelName"
    post:
      operationId: resumeTunnel
      tags: [Tunnels]
      summary: Serve a paused tunnel again
      description: >-
        At the address it had, to the people and tokens it had. A tunnel that
        is not paused is answered as it is.
      responses:
        "200":
          description: The tunnel is served again, and this is it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tunnel" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/TunnelNotKept"
        "404":
          $ref: "#/components/responses/NoSuchTunnel"
  /v1/sandboxes/{sandboxId}/tunnels/{tunnelName}/tokens:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/TunnelName"
    post:
      operationId: createTunnelToken
      tags: [Tunnels]
      summary: Mint a token that opens this tunnel
      description: |
        For the callers that cannot sign in — a `curl`, a CI job, an SDK
        against an API the sandbox serves. Presented to the gateway as
        `Authorization: Bearer ryt_<id>_<secret>`, it opens this tunnel and no
        other, and is taken off the request before it reaches the sandbox.

        **The answer is the only time the token exists outside the caller.**
        This daemon keeps its hash, and so does the gateway.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TunnelTokenRequest" }
      responses:
        "201":
          description: The token, once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TunnelTokenCreated" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/TunnelNotKept"
        "404":
          $ref: "#/components/responses/NoSuchTunnel"
        "409":
          description: This tunnel already has as many live tokens as a tunnel may.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/sandboxes/{sandboxId}/tunnels/{tunnelName}/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/TunnelName"
      - $ref: "#/components/parameters/TunnelTokenID"
    delete:
      operationId: revokeTunnelToken
      tags: [Tunnels]
      summary: Revoke a tunnel's token
      description: |
        It opens nothing from the next request on. The record is kept,
        marked revoked, so "this token never existed" and "it was withdrawn"
        stay two different answers. Revoking one already revoked is answered
        as it is.
      parameters:
        - name: reason
          in: query
          description: Why, for whoever reads the record later.
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: The token, revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TunnelToken" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/TunnelNotKept"
        "404":
          description: No sandbox with this id, no tunnel by this name on it, or no token by this id on that. The message says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/sandboxes/{sandboxId}/tunnels/{tunnelName}/guests:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/TunnelName"
    get:
      operationId: listTunnelGuests
      tags: [Tunnels]
      summary: Who a tunnel's admins let in
      description: |
        The people let in from the tunnel's share page by one of its admins
        — the addresses in `access.emails`. They are kept by the gateway,
        which is where an admin shares from, and read from it through this
        host's relay when asked. So this answers `503` when either is away,
        and says which.
      responses:
        "200":
          description: The guests, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TunnelGuestList" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NoSuchTunnel"
        "503":
          description: The relay or the gateway is not answering. The message says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/sandboxes/{sandboxId}/tunnels/{tunnelName}/guests/{email}:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/TunnelName"
      - name: email
        in: path
        required: true
        description: The guest's address.
        schema: { type: string, maxLength: 254 }
    delete:
      operationId: revokeTunnelGuest
      tags: [Tunnels]
      summary: Take a guest back out
      description: >-
        They reach nothing from their next request on. An admin, named in
        `access.emails`, is not a guest: take them out of that list instead.
      responses:
        "204":
          description: Gone from the list.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No sandbox with this id, no tunnel by this name on it, or no guest by this address on that. The message says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The relay or the gateway is not answering. The message says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/sandboxes/{sandboxId}/tunnels/{tunnelName}/activity:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/TunnelName"
    get:
      operationId: getTunnelActivity
      tags: [Tunnels]
      summary: Who reached a tunnel, and what they asked for
      description: |
        The gateway's record of the requests that arrived for this tunnel,
        newest first: who (a signed-in address, a token's id, or nobody the
        gateway would let in), the method and path — never the query, a
        header or a body — the status and how long it took. A WebSocket is
        one request.

        Read from the gateway, through this host's relay, when asked; nothing
        about it is kept here. So it answers `503` when either is away, and
        says which.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of requests, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TunnelActivityPage" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NoSuchTunnel"
        "503":
          description: The relay or the gateway is not answering. The message says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/sandboxes/{sandboxId}/commands:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    post:
      operationId: runCommand
      tags: [Exec]
      summary: Run one thing and collect what it printed
      description: |
        The short door. Bounded by a deadline and by an output cap, both with
        defaults, because a command with neither holds a connection open for as
        long as the sandbox likes — and the sandbox is running somebody else's
        code.

        **A non-zero exit is a `200`.** It is a successful exchange with an
        unsuccessful command, and a caller that cannot tell those apart cannot
        tell a broken machine from a failing test suite.

        **`argv` is already split. It is not a shell line.** Nothing here splits
        it, so a path with a space in it is not a bug waiting to happen. A
        caller that wants shell syntax asks for a shell — `["sh","-lc","…"]` —
        and owns what that means.

        Anything whose result must survive a dropped connection is a process,
        not a command: `POST .../processes`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandRequest" }
      responses:
        "409":
          $ref: "#/components/responses/NotRunning"
        "200":
          description: It ran. Check `exitCode`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "504":
          description: The command outlived its deadline and was killed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}/processes:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: listProcesses
      tags: [Exec]
      summary: The handles this API holds in this sandbox
      description: >-
        What was started through this API and has not been reaped — not the
        sandbox's process table, which is `GET /v1/sandboxes/{id}/metrics` and
        is the guest's own claim about itself.


        The image's `ENTRYPOINT` is in here, under the name `entrypoint`, which
        is how an unmodified image's own service is watched and signalled
        without it having to know anything about us.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "409":
          $ref: "#/components/responses/NotRunning"
        "400":
          $ref: "#/components/responses/BadRequest"
        "200":
          description: The handles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessPage" }
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: startProcess
      tags: [Exec]
      summary: Start something that outlives this request
      description: |
        **The id is the caller's**, for the reason every other creation here
        takes one: a lost response must not start a second copy of a build.

        The guest owns the handle, its output buffers, and a grace period after
        exit in which the result can still be collected — so a caller whose
        connection dropped reads the exit code rather than wondering. This
        daemon holds no state for this plane and proxies it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProcessRequest" }
      responses:
        "201":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Process" }
        "200":
          description: A process already exists under this id. The retry was absorbed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Process" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >-
            The id is held by a process started with different arguments. Or
            the sandbox is not running, and there is no agent to start it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}/processes/{processId}:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/ProcessID"
    get:
      operationId: getProcess
      tags: [Exec]
      summary: Whether it is still running, and what it exited with
      responses:
        "409":
          $ref: "#/components/responses/NotRunning"
        "400":
          $ref: "#/components/responses/BadRequest"
        "200":
          description: The handle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Process" }
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: reapProcess
      tags: [Exec]
      summary: Drop the handle and its buffers
      description: >-
        Kills it if it is still running, then forgets it. Idempotent. A handle
        the caller never reaps is reaped by the guest after its grace period, so
        this is a way to reclaim the buffers early rather than a thing that must
        be called.
      responses:
        "409":
          $ref: "#/components/responses/NotRunning"
        "400":
          $ref: "#/components/responses/BadRequest"
        "204":
          description: Gone, or was already.
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}/processes/{processId}/stdout:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/ProcessID"
    get:
      operationId: readProcessStdout
      tags: [Exec]
      summary: What it has printed, from a byte offset
      description: >-
        `?from=` is a byte offset into the stream, so a reader that dropped
        resumes exactly where it stopped. `?follow=true` holds the body open
        until the process ends.


        A `from` behind the guest's buffer is a `409` naming the window that is
        still there, never a silent jump: output a caller cannot tell it missed
        is worse than output it knows it missed.
      parameters:
        - $ref: "#/components/parameters/FromBytesQuery"
        - $ref: "#/components/parameters/FollowQuery"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "200":
          description: The bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StreamGapped"
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}/processes/{processId}/stderr:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/ProcessID"
    get:
      operationId: readProcessStderr
      tags: [Exec]
      summary: What it has printed to stderr, from a byte offset
      description: >-
        The same contract as `stdout`, on the other stream. They are separate
        rather than interleaved because a caller parsing output needs to know
        which fd a byte came from, and an interleaving decided here cannot be
        undone there.
      parameters:
        - $ref: "#/components/parameters/FromBytesQuery"
        - $ref: "#/components/parameters/FollowQuery"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "200":
          description: The bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StreamGapped"
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}/processes/{processId}/stdin:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/ProcessID"
    post:
      operationId: writeProcessStdin
      tags: [Exec]
      summary: Write to it, and close its input
      description: >-
        The body is written to the process's standard input. `?close=true`
        closes the pipe afterwards, which is the only way to end a program that
        reads until EOF — and a separate flag rather than an empty body meaning
        it, because an empty write is a thing that happens by accident.
      parameters:
        - name: close
          in: query
          description: Close stdin after writing this.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "204":
          description: Written.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The process has ended, or its input is already closed. Or the
            sandbox is not running, and there is no agent to write to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}/processes/{processId}/signal:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/ProcessID"
    post:
      operationId: signalProcess
      tags: [Exec]
      summary: Send it a signal
      description: >-
        To the process GROUP by default, which is what a caller means by
        "stop the build": a `make` that spawned a compiler and is killed alone
        leaves the compiler running and the sandbox busy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignalRequest" }
      responses:
        "409":
          $ref: "#/components/responses/NotRunning"
        "400":
          $ref: "#/components/responses/BadRequest"
        "204":
          description: Sent.
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}/files:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: readFile
      tags: [Files]
      summary: Read a file, or a tree as a tar
      description: |
        `path` is absolute in the sandbox's own filesystem and is used as sent.
        There is no chroot and no workspace root here: a sandbox is one blast
        radius, and confining this route would be a boundary inside a boundary
        that buys nothing.

        A directory comes back as `application/x-tar`. A byte range is
        `?from=`, and `?follow=true` holds the body open — which is how a log
        file is tailed without a process. A file truncated or replaced under a
        follower is a `409` rather than bytes from a different file appended to
        bytes from the old one.
      parameters:
        - $ref: "#/components/parameters/PathQuery"
        - $ref: "#/components/parameters/FromBytesQuery"
        - $ref: "#/components/parameters/FollowQuery"
      responses:
        "200":
          description: The bytes, or the archive.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/x-tar:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StreamGapped"
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: writeFile
      tags: [Files]
      summary: Write a file, or unpack a tar
      description: |
        The body is the file's contents, or an archive to unpack at `path` when
        `format=tar`. Parent directories are created.

        **Whatever is written here is disclosed to the workload**, immediately
        and by definition. There is no such thing as a file the sandbox holds
        and the code inside it cannot read. A credential belongs on this side of
        the wire, and no mode, owner or path changes that.

        `mode` and `owner` are honoured because an image's own service usually
        does not run as root, and a config file it cannot open is the shape this
        failure otherwise takes.
      parameters:
        - $ref: "#/components/parameters/PathQuery"
        - $ref: "#/components/parameters/FormatQuery"
        - name: mode
          in: query
          description: >-
            The file's permissions, octal, e.g. `0644`. Absent leaves `0644` for
            a new file and an existing file's mode alone.
          schema: { type: string }
          example: "0600"
        - name: owner
          in: query
          description: >-
            `uid:gid` inside the guest. Absent writes as root, which is what
            the guest agent runs as.
          schema: { type: string }
          example: "1000:1000"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "409":
          $ref: "#/components/responses/NotRunning"
        "204":
          description: Written.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: >-
            Larger than this host will accept in one request. A caller with more
            than that sends a tar, or writes in pieces.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteFile
      tags: [Files]
      summary: Remove a file or a tree
      parameters:
        - $ref: "#/components/parameters/PathQuery"
      responses:
        "409":
          $ref: "#/components/responses/NotRunning"
        "204":
          description: Gone, or was not there.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/sandboxes/{sandboxId}/files/list:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: listDir
      tags: [Files]
      summary: What is in a directory
      description: >-
        Paged, because a directory in a sandbox is whatever the workload made it
        and `node_modules` exists.
      parameters:
        - $ref: "#/components/parameters/PathQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "409":
          $ref: "#/components/responses/NotRunning"
        "400":
          $ref: "#/components/responses/BadRequest"
        "200":
          description: The entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirListing" }
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SandboxUnreachable"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/keys:
    get:
      operationId: listKeys
      tags: [Keys]
      summary: The keys this daemon will accept
      description: >-
        The caller's own keys; an administrator's call lists everybody's,
        each with its owner, and may ask for one person's.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: owner
          in: query
          description: >-
            Only this person's keys. A caller who is not an administrator
            may name only themselves.
          schema: { type: string, format: email }
      responses:
        "200":
          description: The keys, without their secrets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyPage" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createKey
      tags: [Keys]
      summary: Mint a key
      description: >-
        Needs `keys.admin`, and may only grant scopes the caller already has.
        Otherwise `keys.admin` is `*`, spelled at one remove. Nor may it grant
        a wider reach than the caller's: a key that acts only on its `own`
        sandboxes mints only keys that do, each on its own and not on its
        minter's.


        **The key is its owner's**: the caller's, unless an administrator
        names somebody else, who must be somebody this daemon lets in. It can
        never do more than its owner may, and stops working when its owner is
        taken off this daemon's lists.


        **The secret is in this response and nowhere else.** What is stored is a
        SHA-256 of it, so the store names who may call and cannot be used to
        call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyRequest" }
      responses:
        "201":
          description: Minted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyCreated" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/keys/authorizations:
    post:
      operationId: authorizeKey
      tags: [Keys]
      summary: Approve a key for a program that asked for one
      description: |
        What the console's `authorize` page calls when the person signed in
        to it approves: a key is described, **nothing is minted**, and a code
        comes back that `POST /v1/keys/authorizations/redeem` trades for the
        key, once.

        Needs `keys.admin`, and approves exactly what `POST /v1/keys` would
        mint for the same caller and refuses what it would refuse: scopes the
        caller holds, a reach no wider than its own, an expiry within ten
        years. **The key is the caller's own.** There is no `owner` here,
        and one that is sent is not read: what is approved is a program
        acting as the person approving it, and an administrator approving on
        somebody else's behalf would be one person's click putting a key in
        another's name.

        **The code is not the key.** It passes through a browser's address
        bar and its history, or a person's clipboard, so it is bound to
        `codeChallenge`: the SHA-256 of a verifier that only the program
        which asked holds, and which the redeem must show.

        **Where a code may be sent is this daemon's to judge.** `redirectUri`
        is where the page means to take the browser with the code, and is
        accepted only as plain HTTP on the loopback of the machine the
        browser is on, with a port. Anything else is refused, so that a link
        somebody was sent cannot have a code delivered to another host. The
        page checks the same before it shows anything; this is the check that
        does not depend on the page.

        The code lasts five minutes. What is kept of it is its SHA-256, in
        the database every daemon in front of it reads, so the redeem may be
        answered by another daemon than this one.

        **An approval is no better than what made it.** It is tied to the key
        or the session this call carried, and goes with it: revoke that key,
        sign out of that session, or let either expire, and what it approved
        and nobody has collected can no longer be.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyAuthorizationRequest" }
      responses:
        "201":
          description: Approved. The code is in this response and nowhere else.
          headers:
            Cache-Control:
              description: "`no-store`: the code is a secret for as long as it lasts."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyAuthorization" }
        "400":
          description: >-
            The body is not the JSON this route takes; the key has no name
            or one longer than 128 characters, names a scope or a reach this
            contract does not define, has no scopes, has expired already or
            expires more than ten years from now; the name is not text a
            person can read (`KeyRequest.name`); `codeChallenge` is not the
            43 characters a SHA-256 is in base64url; or `redirectUri` is not
            plain HTTP on loopback with a port. The message says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: >-
            The caller does not hold `keys.admin`; or asked for a scope it
            does not hold itself, or — being a key that acts only on its
            `own` sandboxes — for a wider reach than its own. The message
            names the scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: >-
            Nothing was approved: the caller already has sixteen approvals
            waiting to be redeemed (`capacity_exceeded`; each lasts five
            minutes, and they are counted for each person, so that nobody is
            refused for what somebody else has waiting), or the database is
            not answering (`upstream_error`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/keys/authorizations/redeem:
    post:
      operationId: redeemKeyAuthorization
      tags: [Keys]
      security: []
      summary: Trade an approval's code for its key
      description: |
        What the program that asked calls, with the code the person's browser
        brought it and the verifier it made before asking. The key is minted
        by this call, as its approver's, and this response is the only place
        its secret ever is.

        **Unauthenticated, and the one route here that hands over a
        credential without being shown one.** The caller has no key: this is
        how it gets its first. What stands in for a credential is the pair it
        sends — a code of 256 random bits that a signed-in person's approval
        made, minutes ago, and the verifier whose SHA-256 that approval was
        bound to. Neither is worth anything without the other, and nothing
        is handed over that was not approved.

        **A code works once**, and is spent by being presented — with the
        right verifier or the wrong one. A code somebody else saw is then
        used up by their first guess at the verifier, and the program it was
        meant for finds out, rather than racing them.

        **One answer for every code that yields no key.** A code this daemon
        never gave, one already redeemed, one older than five minutes, one
        whose verifier does not match or is not a verifier at all, one whose
        approving key or session has been revoked, signed out or has
        expired, and one whose approver may no longer do what they approved
        are the same `400` with the same message: which of them it was is
        what somebody holding a stolen code would like to know.

        **What is minted is what `POST /v1/keys` would mint now.** The
        approver is asked about again, of the daemon answering this call: a
        person taken off its lists since, or who may no longer mint keys or
        use a scope they approved, is given no key — nor one cut down to
        what they still may.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyAuthorizationRedemption" }
      responses:
        "200":
          description: >-
            Minted. The secret is in this response and nowhere else, and the
            code is spent.
          headers:
            Cache-Control:
              description: "`no-store`: the body is a credential."
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyCreated" }
        "400":
          description: >-
            No key: the code and verifier do not redeem one, for any of the
            reasons above and without saying which; or the body is not the
            JSON this route takes, which the message does say. A code that
            was presented is spent either way.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >-
            The database is not answering. Nothing was minted, and a code
            that was not reached is not spent: the same call may be made
            again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/keys/{keyId}:
    parameters:
      - name: keyId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeKey
      tags: [Keys]
      summary: Revoke a key
      description: |
        In force at once, on every daemon in front of the same database: a
        key revoked in a minute is a key that is not revoked. Idempotent.

        With `keys.admin`: the caller's own keys, or anybody's for an
        administrator.

        **Any key may revoke itself**, whatever its scopes: called with a
        key, naming that key's own id, this needs nothing else. So a program
        given a key it cannot mint with can still hand it back when it is
        done, and a key that could not be revoked by its holder is one that
        lives until somebody else remembers it. It may name no other key that
        way, its owner's included.
      responses:
        "204":
          description: Revoked, or was already.
        "403":
          description: >-
            The caller does not hold `keys.admin` and named a key that is not
            the one it called with; or holds it, is not an administrator, and
            named somebody else's key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth:
    get:
      operationId: getAuth
      tags: [Auth]
      security: []
      summary: How a person may sign in here
      description: >-
        Unauthenticated, because it is what the console reads before anybody
        has signed in, to know whether to offer Google.
      responses:
        "200":
          description: The ways to sign in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthMethods" }
  /v1/auth/google:
    get:
      operationId: beginGoogleSignIn
      tags: [Auth]
      security: []
      summary: Sign in with Google
      description: |
        Where the console sends a browser to sign in: a redirect to Google,
        which sends it back to `/v1/auth/google/callback`.

        The sign-in is written to the database, not held by this process, so
        the callback may be answered by any daemon in front of it.
      parameters:
        - name: returnTo
          in: query
          description: >-
            The console page to come back to, as a path: `/console` or under
            it, with its query when it has one, which comes back as it was
            sent. Anything else — another host, another path on this one — is
            refused, since a sign-in that redirects wherever its link says is
            how a phishing page ends up behind a real login.
          schema: { type: string, example: /console/sandboxes }
      responses:
        "302":
          description: To Google.
          headers:
            Location:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: This daemon has no Google sign-in configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >-
            The sign-in could not be started: too many are in flight, or the
            database is not answering. The message says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/auth/google/callback:
    get:
      operationId: completeGoogleSignIn
      tags: [Auth]
      security: []
      summary: Where Google sends a browser back
      description: |
        Registered with Google as this daemon's redirect URI:
        `<console url>/v1/auth/google/callback`.

        A person Google vouches for — an address it has verified — and whom
        this daemon lets in is given a session and sent to the page they
        started from. Anybody else is sent to `/console` with
        `signInError` saying why, and given nothing.
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - name: error
          in: query
          description: Google's, when the person did not sign in.
          schema: { type: string }
      responses:
        "302":
          description: >-
            Signed in, with the session cookie set, to where the sign-in was
            started from; or not, to `/console?signInError=<SignInError>`.
          headers:
            Location:
              schema: { type: string }
            Set-Cookie:
              schema: { type: string }
        "404":
          description: This daemon has no Google sign-in configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/auth/signout:
    post:
      operationId: signOut
      tags: [Auth]
      security: []
      summary: Sign out
      description: >-
        Ends the session the request carries, on every daemon in front of the
        same database, and tells the browser to forget it. Answers the same
        with no session, or one already ended.
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              schema: { type: string }
  /v1/me:
    get:
      operationId: getMe
      tags: [Auth]
      summary: Who is calling
      description: >-
        The person a call is made as — signed in, or the owner of the key it
        carries — and what they may do with it now. Any session and any key.
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/me/picture:
    get:
      operationId: getMyPicture
      tags: [Auth]
      summary: The caller's picture
      description: >-
        The picture Google gave the caller, fetched once when they signed in
        and kept in the control plane's database, so that a browser never
        loads it from Google. Cacheable for good at the address `Me.picture`
        names, which changes with the picture.
      parameters:
        - name: v
          in: query
          description: The picture's version, from `Me.picture`; for caches only.
          schema: { type: string }
      responses:
        "200":
          description: The picture.
          content:
            image/*:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: >-
        `Authorization: Bearer rysk_<id>_<secret>`. Scoped and expiring; see
        `Scope` for what each one opens, and it opens no more than its owner
        may do.
    session:
      type: apiKey
      in: cookie
      name: runyard_console_session
      description: |
        A person signed in to the console, from `GET /v1/auth/google`. What it
        opens is what that person may do.

        **Only from the console's own pages.** A request carrying it from
        anywhere else — a tunnel on a neighbouring host, whose pages are
        whatever a sandbox serves — is treated as carrying nothing, so a page
        cannot act as whoever happens to be signed in. A request with a key
        is judged by the key alone.

        A route either credential opens answers `503` when the database that
        holds them is not answering, rather than `401`: the caller is not
        signed out, and a console that said so would send them to sign in
        again, into the same outage.

  parameters:
    Limit:
      name: limit
      in: query
      description: How many to return. The host's default and ceiling are in `GET /v1/info`.
      schema: { type: integer, minimum: 1, maximum: 500 }
    Cursor:
      name: cursor
      in: query
      description: >-
        From a previous page's `nextCursor`. Opaque: it encodes a position and a
        snapshot, and a caller that constructs one gets a `400`.
      schema: { type: string }
    VolumeName:
      name: volumeName
      in: path
      required: true
      description: As written in `spec.disk.volume`.
      schema: { $ref: "#/components/schemas/VolumeName" }
    ImageID:
      name: imageId
      in: path
      required: true
      description: >-
        As returned by `POST /v1/images` — derived from the manifest digest, not
        the reference. Two tags pointing at the same content are one id.
      schema: { type: string }
      example: img_9f2a1c4e7b30
    RuleName:
      name: ruleName
      in: path
      required: true
      description: >-
        An egress rule's name, as its writer chose it: lowercase letters,
        digits and hyphens, starting and ending with a letter or a digit.
      schema:
        type: string
        pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        example: github-ssh
    TunnelName:
      name: tunnelName
      in: path
      required: true
      description: >-
        A tunnel's name, as its writer chose it: lowercase letters, digits and
        single hyphens, starting and ending with a letter or a digit, at most
        30 characters — it is the start of a hostname.
      schema:
        type: string
        pattern: "^[a-z0-9]([a-z0-9-]{0,28}[a-z0-9])?$"
        example: preview
    TunnelTokenID:
      name: tokenId
      in: path
      required: true
      description: A token's id, the part of it between `ryt_` and the secret.
      schema:
        type: string
        pattern: "^[a-z0-9]{8}$"
        example: t4kq9z2m
    SandboxID:
      name: sandboxId
      in: path
      required: true
      description: >-
        As minted by `POST /v1/sandboxes`: a UUID, never reused on this host.
        What a person calls the sandbox is `labels.name`, and this is not it —
        so anything that is not a UUID is a `400` saying so, rather than a
        `404` that reads as a sandbox that might exist under that name.
      schema:
        type: string
        format: uuid
      example: 0192f7a4-5b1e-7c3d-9a2f-4e6b8c1d0a53
    BrokerName:
      name: brokerName
      in: path
      required: true
      description: >-
        A broker's name, as a spec refers to it and as the workload finds it in
        `/run/runyard/brokers.json`.
      schema: { $ref: "#/components/schemas/BrokerName" }
    ProcessID:
      name: processId
      in: path
      required: true
      description: The caller's own, as given to `POST .../processes`.
      schema: { type: string }
      example: build-1
    PathQuery:
      name: path
      in: query
      required: true
      description: >-
        An absolute path inside the sandbox, used as sent. Not resolved against
        anything here — the guest resolves it, in the machine it belongs to.
      schema: { type: string }
      example: /workspace/main.go
    FormatQuery:
      name: format
      in: query
      description: >-
        `raw` writes the body as the file. `tar` unpacks it at `path`, which is
        how a tree is put in without one request per file.
      schema:
        type: string
        enum: [raw, tar]
        default: raw
    FromBytesQuery:
      name: from
      in: query
      description: Start at this byte offset.
      schema: { type: integer, format: int64, minimum: 0 }
    FromSeqQuery:
      name: from
      in: query
      description: >-
        Start after this sequence number. Absent starts at the oldest retained
        event, which is what a caller with no cursor wants.
      schema: { type: integer, format: int64 }
    FollowQuery:
      name: follow
      in: query
      description: >-
        Hold the body open and keep sending as more arrives, until the thing
        being read ends.
      schema: { type: boolean, default: false }

  responses:
    Unauthorized:
      description: >-
        No key or session, or one this daemon will not accept — missing,
        expired, revoked, or belonging to somebody it no longer lets in. One
        answer for all of them on purpose: telling a caller which it is tells
        somebody holding a stolen key whether it is worth keeping.


        Distinct from `403`, which is a key that IS accepted and does not carry
        the scope the route needs.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: The request is malformed. The body says which field.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >-
        The key is valid and does not hold the scope this route needs — or it
        acts only on its `own` sandboxes (`KeyReach`) and this route speaks
        for the whole host. Distinct from `401`, which is a key that is
        missing, expired or revoked.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: >-
        No such thing here. For a key that acts only on its `own` sandboxes
        (`KeyReach`), a sandbox it did not make is no such thing: the answer
        is this one, with the same body, whether the sandbox is somebody
        else's or was never there.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TunnelNotKept:
      description: >-
        The change could not be written down on this host, so it was not
        made: a tunnel a restart of the daemon would forget is one nothing
        could take away again. The message says what the disk said.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoSuchTunnel:
      description: No sandbox with this id, or no tunnel by this name on it. The message says which.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gapped:
      description: >-
        The cursor is behind what is retained. The body carries the window that
        IS there, so the caller can resume at a sequence it can see rather than
        guessing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GapError" }
    StreamGapped:
      description: >-
        The offset is behind the buffer, or the file was truncated or replaced
        under a follower, and the body carries the range that is there. Or the
        sandbox is not running — on its way up, paused, stopped or failed — and
        there is no agent to read from; that body has no range, and its
        message says which.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/StreamGap"
              - $ref: "#/components/schemas/Error"
    StillBooting:
      description: >-
        The machine is `creating` or `booting`, and its brokers are being opened
        from its spec as it was when that began (`conflict`). A change made now
        would reach the spec and not the machine, so it is refused; ask again
        once it is `ready`. Or it is `paused`, and its agent cannot be told
        until it is resumed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EgressNotChangeable:
      description: >-
        The sandbox is not in a state where its rules can change — it is
        still `creating`, or it is `stopped`, `failed` or `gone`. Rules are
        installed on a running interface; a sandbox's first rules are the
        ones in the spec it is created with.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EgressNotInstallable:
      description: >-
        The rules are not ones this host can install: the kernel refused
        them, or this sandbox has no interface. Nothing changed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotRunning:
      description: >-
        The sandbox is not running — on its way up, paused, stopped or failed —
        so there is no agent to ask (`conflict`). The message says which. A
        paused one answers once it is resumed, and a stopped one once it is
        started.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SandboxUnreachable:
      description: >-
        The machine exists and its guest is not answering. Retry: this is the
        state that comes back, where `failed` is the one that does not.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    HostInfo:
      type: object
      required: [id, instance, protocol, build, hypervisor, capabilities, defaults, limits]
      properties:
        id:
          type: string
          description: >-
            Stable for the life of the deployment. It is the host in every
            sandbox's identity, which is why it exists at all — a display name
            would be renamed one day and take every issued identity with it.
          example: sandboxes-lon-1
        instance:
          type: string
          description: >-
            This daemon's name among those on this host (`-instance`, `main`
            unless it was given another): one to six lowercase letters and
            digits. Its state directory is bound to it, and everything it makes
            on the host outside a sandbox's namespace is named by it — its
            table (`runyard_sandboxes_<instance>`), its sandboxes' namespaces
            (`runyard-<instance>-<id>`) and their links (`ry<instance>-<slot>`)
            — so that several daemons, each with a name, a state directory, an
            address and a subnet of its own, run side by side on one host.
          example: main
        protocol:
          type: integer
          description: >-
            The wire protocol this build speaks. Checked at startup. 2 is the
            first where a sandbox's id is a UUID this daemon mints and creation
            is `POST /v1/sandboxes`; a caller written against 1 names its
            sandboxes, and every such call is now a `400`. 3 is the first where
            `spec.brokers` is a list of objects rather than of names, so a
            one-off upstream can be written into a spec; a list of strings is
            now a `400`.
          example: 3
        build: { type: string, example: runyard-sandboxes 1.0.0 }
        hypervisor:
          type: object
          description: What is actually booting the machines.
          required: [name, version]
          properties:
            name: { type: string, example: cloud-hypervisor }
            version: { type: string, example: "48.0" }
            kernel:
              type: string
              description: The guest kernel this host boots, for a bug report.
              example: 6.12.9-runyard
        brokers:
          type: array
          description: >-
            The shared brokers a spec may name without writing out an upstream,
            as `GET /v1/brokers` lists them. Here too, so a caller deciding what
            to ask for reads one document.
          items: { $ref: "#/components/schemas/Broker" }
        network: { $ref: "#/components/schemas/HostNetwork" }
        capabilities:
          type: object
          description: >-
            What this host can do, so a caller finds out before a spec is
            refused rather than after.
          properties:
            nested:
              type: boolean
              description: >-
                Whether a sandbox can be given a working `/dev/kvm`. False
                makes `nested: true` a `422`.
            reflink:
              type: boolean
              description: >-
                Whether the filesystem holding the disks gives copy-on-write
                clones. It used to be the cost model and is not any more: every
                sandbox shares its image's filesystem read-only, and all that is
                copied per sandbox is an empty filesystem of a few megabytes.
            maxSandboxes: { type: integer, example: 64 }
            brokersReachPrivate:
              type: boolean
              description: >-
                Whether a ONE-OFF broker may be dialled to a loopback,
                link-local or private address. False unless the operator said
                otherwise, and then such a broker is refused when it connects
                rather than when it is declared — resolution happens then, and
                an address checked earlier would be one a DNS answer could
                change underneath the check. Whatever this says, a one-off
                broker is never dialled to the address of a sandbox on this
                host: no sandbox reaches another.
        defaults:
          type: object
          description: What a `PUT` gets for anything it leaves out.
          properties:
            cpus: { type: integer, example: 2 }
            memory: { type: string, example: 2Gi }
            disk: { type: string, example: 20Gi }
            commandTimeoutSeconds: { type: integer, example: 60 }
        limits:
          type: object
          description: What this host will accept, advertised so bounds agree.
          properties:
            maxCpus: { type: integer, example: 16 }
            maxMemory: { type: string, example: 64Gi }
            maxDisk: { type: string, example: 500Gi }
            maxFileBytes:
              type: integer
              format: int64
              description: The ceiling on one `PUT .../files` body.
              example: 67108864
            maxOutputBytes:
              type: integer
              format: int64
              description: The ceiling on a command's captured output.
              example: 1048576
            eventRetention:
              type: string
              description: >-
                How long a sandbox's events are kept after it goes. A cursor
                older than this is the `409` the events route describes.
              example: 168h

    HostNetwork:
      type: object
      description: |
        Whether this host gives sandboxes a network, and what stands between
        one and the internet.

        A sandbox's firewall is in its own namespace, but what it is allowed to
        send to the internet crosses this host's own stack, where every
        firewall on this host runs and a drop in any of them is final. So what
        this daemon changed to let it out is said here, and so is anything it
        found in the way that it did not change — a firewall somebody else
        chose is reported rather than edited.
      required: [enabled, forwarding, warnings]
      properties:
        enabled:
          type: boolean
          description: >-
            Whether sandboxes are given an interface at all. Without one they
            reach nothing but their brokers.
        subnet:
          type: string
          description: >-
            The range each sandbox's /30 is drawn from: the daemon's
            `-subnet`, `172.30.0.0/16` unless it was given another.
          example: 172.30.0.0/16
        forwarding:
          type: boolean
          description: Whether this host forwards IPv4, without which nothing leaves it.
        docker:
          type: boolean
          description: >-
            Whether Docker's FORWARD chain drops by default here, and its
            DOCKER-USER chain was told to let sandboxes' traffic through.
        connectionCounts:
          type: boolean
          description: >-
            Whether this kernel can count the bytes and packets of each tracked
            connection, which each sandbox's namespace is told to. Without it,
            `connections` are listed with no counts.
        dnsUpstream:
          type: array
          description: >-
            Where sandboxes' resolvers ask the names their policies allow
            (`-dns-upstream`). Empty is this host's own resolvers, as its
            /etc/resolv.conf names them.
          items: { type: string }
          example: ["1.1.1.1:53"]
        warnings:
          type: array
          description: What stands in the way, each with what to do about it.
          items: { type: string }

    ImageRequest:
      type: object
      required: [ref]
      properties:
        ref:
          type: string
          description: >-
            An OCI reference: what you would hand `docker pull`. A digest is
            resolved as written; a tag is resolved now, and re-resolved on every
            later pull, so a tag pushed over becomes a new image rather than
            silently changing this one.
          example: ghcr.io/runyard-ai/claude-sandbox:2026-09
        force:
          type: boolean
          description: >-
            Build the rootfs again even though this exact content is cached and
            was written by this extractor. Not what picks up a re-pushed tag —
            that is already a new id. This is for the case a digest cannot
            express: the same content, written differently, because something
            below it changed.

    Image:
      type: object
      required: [id, ref, digest, state, createdAt]
      properties:
        id: { type: string, example: img_9f2a1c4e7b30 }
        ref:
          type: string
          description: The reference this was pulled from, as asked for.
          example: ghcr.io/runyard-ai/claude-sandbox:2026-09
        digest:
          type: string
          description: >-
            The manifest digest the id came from, kept so an operator can tell
            which content this actually is.
          example: sha256:2d1f…
        state: { $ref: "#/components/schemas/ImageState" }
        error:
          type: string
          description: >-
            Why it is `failed`, for a person. Present only then. A failed image
            is kept rather than swept, because one that vanishes is a pull
            nobody can diagnose.
        size:
          type: integer
          format: int64
          description: The built rootfs, in bytes.
        sandboxes:
          type: integer
          description: >-
            How many sandboxes are booted from it right now. What makes the
            `409` on `DELETE` predictable rather than a surprise. Left out for
            a key that acts only on its `own` sandboxes, whose `409` says that
            the image is in use and not by how many.
        entrypoint:
          type: array
          items: { type: string }
          description: >-
            The image's own `ENTRYPOINT` and `CMD`, joined, as read from its
            config. Reported because it is what a sandbox will run unless
            `spec.entrypoint` says otherwise, and reading it from here beats
            discovering it from a machine that did something unexpected.
        createdAt: { type: string, format: date-time }
        readyAt: { type: string, format: date-time }

    ImageState:
      type: string
      description: |
        | state | what it means |
        |---|---|
        | `pulling` | fetching, or flattening layers into a rootfs. No usable disk yet |
        | `ready` | a sandbox can boot from it |
        | `failed` | it will not become ready; `error` says why |
      enum: [pulling, ready, failed]

    SandboxSpec:
      type: object
      description: |
        What a machine should be.

        Nothing here names a host path, a device or a credential. Those are
        this daemon's configuration; the test for whether a field belongs is
        whether it is a property of the MACHINE rather than of the host it
        happens to be on.
      required: [image]
      properties:
        image:
          type: string
          description: >-
            An OCI reference. Required, and the only required field: everything
            else has a default this host advertises.
          example: ghcr.io/runyard-ai/claude-sandbox:2026-09
        cpus: { type: integer, minimum: 1, example: 4 }
        memory:
          type: string
          description: With a unit, e.g. `8Gi`.
          example: 8Gi
        disk:
          $ref: "#/components/schemas/DiskSpec"
        nested:
          type: boolean
          description: >-
            Whether the sandbox gets a working `/dev/kvm` of its own. Off by
            default and asked for explicitly. A host that cannot give it refuses
            the spec rather than booting a guest that sees the CPU extension and
            finds no device — which is the most confusing way for this to fail.
        entrypoint:
          type: array
          items: { type: string }
          description: >-
            What to run instead of the image's own `ENTRYPOINT`/`CMD`. Absent
            runs the image's, which is what makes an unmodified `postgres:17`
            work. Empty — `[]` — runs nothing, which is what a sandbox used only
            through `commands` and `processes` wants.
          example: ["/usr/bin/my-service", "--config", "/etc/svc.yaml"]
        env:
          type: object
          additionalProperties: { type: string }
          description: >-
            Merged over the image's own environment, for the entrypoint and for
            everything started later. **Visible to the workload**, which is
            everything in the sandbox — not a place for a secret.
        hostname:
          type: string
          description: >-
            What the guest calls itself. Absent uses the sandbox id. Not taken
            from `labels.name`, because a label is never interpreted — a caller
            that wants the two to agree sends both.
        egress:
          $ref: "#/components/schemas/EgressSpec"
        ports:
          type: array
          description: |
            Ports of this host that carry traffic INTO the sandbox. The other
            direction from `egress`: there the workload dials out, here
            somebody dials in and the workload never decides when.

            Inbound is not filtered by `egress` and is not meant to be — a
            policy about what a sandbox may reach says nothing about who may
            reach it, and conflating them is how a service gets published by
            accident. Nothing is published unless it is written here.
          items: { $ref: "#/components/schemas/PublishedPort" }
        brokers:
          type: array
          items: { $ref: "#/components/schemas/SandboxBrokerSpec" }
          description: |
            What this sandbox may reach: shared brokers by name, and one-off
            brokers with their upstream written out. See the Brokers section
            for the difference.

            A sandbox cannot reach one it was not given, because the name it
            sends is checked against ITS list on the host side before anything
            is dialled.

            Each becomes a loopback port inside the machine; `sandbox.brokers`
            says which, and so does `/run/runyard/brokers.json` inside it. The
            workload sees an ordinary HTTP endpoint and holds no credential: the
            identity the upstream sees is attached out here.

            Names are unique within one sandbox. `PUT` and `DELETE` on
            `.../brokers/{name}` change the list while the machine runs, and the
            list here is kept equal to it.
          example:
            - { name: github }
            - name: billing
              upstream: { url: "https://billing.example.com/" }
        labels:
          type: object
          additionalProperties: { type: string }
          description: >-
            The caller's own, stored and echoed and never interpreted. What this
            daemon routes on is elsewhere; this is what the caller uses to find
            a machine again.

            `name` is the one with a convention: it is what the console shows in
            place of the id, and `GET /v1/sandboxes?label=name=…` finds it. It
            is still only a label — not unique, not checked, and not the
            sandbox's identity, which is the id.
          example: { name: pr-1234-review, owner: runyard, session: "1234" }

    VolumeName:
      type: string
      description: >-
        Lower case letters, digits, `.`, `_` and `-`, starting with a letter or
        a digit. It is a file name on the host, which is why it is this narrow.
      pattern: "^[a-z0-9][a-z0-9._-]{0,62}$"
      example: chat-4f1c

    Volume:
      type: object
      required: [name, digest, bytes, allocatedBytes, createdAt]
      properties:
        name: { $ref: "#/components/schemas/VolumeName" }
        digest:
          type: string
          description: >-
            The manifest digest of the image it was first laid over, which
            every sandbox that names it must be booted from.
          example: sha256:c1c9…
        bytes:
          type: integer
          format: int64
          description: The size the guest sees, from the last sandbox that named it.
        allocatedBytes:
          type: integer
          format: int64
          description: What it costs on this host, which is what it holds.
        sandboxId:
          type: string
          format: uuid
          description: The sandbox holding it. Absent when none does.
        createdBy:
          allOf: [{ $ref: "#/components/schemas/Creator" }]
          description: >-
            Who made the sandbox that first laid it down, which is whose it
            is: a sandbox made later that names it does not change this.
            Absent on a volume made before this was recorded. When it is a
            key that acts only on its `own` sandboxes (`KeyReach`), only that
            key attaches the volume.
        createdAt: { type: string, format: date-time }

    Creator:
      type: object
      description: >-
        Who made a sandbox or a volume: the person, and the key when the call
        carried one. Written down when it is made and never changed, so it
        still names a key that has since been revoked.
      required: [user]
      properties:
        user:
          type: string
          format: email
          description: >-
            The person who was signed in to the console, or the owner of the
            key the call carried.
          example: ada@example.com
        keyId:
          type: string
          description: >-
            The key the call carried. Absent when it was a console session.
            It is what a key that acts only on its `own` sandboxes is matched
            against.
          example: k7f3a91c
        keyName:
          type: string
          description: >-
            That key's name when it made this, for a person reading it: the
            key may be gone by now, and its id alone says nothing to them.
          example: "runyard server — lon-1"

    VolumeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Volume" }

    DiskSpec:
      type: object
      description: |
        The sandbox's disk, which IS the machine: everything installed, written
        or broken lives in it and it outlives every boot.

        It holds what the sandbox wrote, laid over `spec.image`'s filesystem —
        which is shared, read-only, with every other sandbox from that image.
        The guest sees one root filesystem, as big as this disk.

        It is a volume, and starts empty, unless it is one that an earlier
        sandbox wrote to — and then it is that disk, attached rather than
        copied.
      properties:
        volume:
          allOf:
            - $ref: "#/components/schemas/VolumeName"
          description: |
            The volume that is this sandbox's disk: made empty the first time
            it is named, attached as it was left every time after. It outlives
            the sandbox the way any kept disk does, and the next sandbox that
            names it boots with everything the last one wrote.

            **Absent, the sandbox is given a new one**, named `vol_` and a
            random id, and the sandbox's `spec` says which. That name is what
            a later sandbox gives to have this one's disk.

            **Attached, not copied**, so a sandbox on a volume that holds
            gigabytes boots as fast as one on an empty disk. The price is that
            **one sandbox holds it at a time**: a create naming a volume that
            another sandbox holds — running, stopped or failed — is a `409`
            `volume_in_use`, and the next one can have it once that one is
            dropped.

            **A key that acts only on its `own` sandboxes names a volume it
            made, or a name no volume has.** Any other is a `403` — one
            answer, whether that volume is held or free and whatever image it
            was laid over, because those are somebody else's to know.

            **A volume such a key laid down is attached by that key alone.**
            Named by anybody else — another key, whatever it acts on, or a
            person in the console — it is a `403`, saying whose it is to a
            caller that may read that: what it holds is a filesystem that key
            chose, and booting it is running what that key put there. Delete
            the volume to have its name.

            **A volume belongs to the image it was first laid over**, by
            digest: what it holds is changes to THAT filesystem — a package
            database, deleted files — and laid over another it describes a
            machine nobody built. A sandbox whose image resolves to a
            different digest fails, with the reason, rather than booting that
            machine. Pin the image by digest, or delete the volume, to move
            to a new one.
        size:
          type: string
          description: >-
            With a unit: the room the workload has to write in, which is what
            `df /` says inside the guest. The image's own files do not count
            against it.


            Applied on every boot, so raising it reaches a sandbox that already
            exists. That is the difference between a declaration and a one-shot
            argument. Lowering it is refused when the machine next boots —
            `failed`, with the reason — because honouring it would mean
            truncating a filesystem, which is data loss on request.
          example: 40Gi
        persist:
          type: boolean
          default: true
          description: >-
            Whether the disk survives `DELETE`. The default is the conservative
            one; `?disk=delete` on the delete overrides it either way, and this
            is what protects a machine somebody deletes without thinking.

    EgressSpec:
      type: object
      description: |
        What this sandbox may resolve and reach: a list of named rules.

        **Everything no rule names is refused.** That is the default and it is
        said out loud rather than left to be discovered — a sandbox with no
        rules reaches its own resolver and nothing else, and "nothing" is
        otherwise indistinguishable from a broken network.

        Names are enforced by the sandbox's resolver, which is this host's: a
        name a rule allows resolves, and what it resolves to is pinned open on
        that rule's ports for as long as that rule's `pinTtl` says; a name no
        rule allows does not resolve. A workload that dials a literal address
        never asked the resolver, so nothing was pinned, so it is refused —
        which is the property that makes a name-based allowlist mean anything.

        Rules add up and never subtract: a packet is let through if any rule
        lets it through. A name two rules allow is open on the ports of both,
        each for as long as its own rule says.

        **A field a policy or a rule does not have is a `400`**, where
        elsewhere in this contract one is ignored: a policy read without it
        would be a different policy, and here that difference is what a
        workload can reach.
      properties:
        rules:
          type: array
          maxItems: 64
          description: The rules, each name at most once.
          items: { $ref: "#/components/schemas/EgressRule" }
      example:
        rules:
          - name: github
            domains: ["github.com", "*.github.com"]
          - name: github-ssh
            domains: ["github.com"]
            ports: ["tcp/22"]
          - name: package-mirror
            cidrs: ["10.4.0.0/24"]
            ports: ["tcp/443"]
          - name: internet
            internet: true
            ports: ["tcp/1-65535", "udp/1-65535"]

    EgressRule:
      description: One named rule.
      allOf:
        - type: object
          required: [name]
          properties:
            name:
              type: string
              pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
              description: >-
                What the rule is called, and how it is changed and removed:
                lowercase letters, digits and hyphens. Chosen by whoever
                writes it, so an audit reads `github-ssh` rather than an id.
              example: github-ssh
        - $ref: "#/components/schemas/EgressRuleSpec"

    EgressRuleSpec:
      type: object
      description: |
        What one rule opens: its names and its ranges, on its ports.

        At least one name or one range, or `internet` — a rule that names
        nothing opens nothing, and is refused rather than kept as a line that
        reads as if it did something.
      properties:
        internet:
          type: boolean
          description: >-
            Every public address, on this rule's ports: any name resolves, to
            what it resolves to that is public, and any public address is
            reached, dialled by name or not. Public is what is not private,
            loopback, link-local, carrier-grade NAT, multicast, reserved
            (`240.0.0.0/4`) or "this network" (`0.0.0.0/8`) space — so this
            opens the internet and not the operator's network,
            which a range such as `0.0.0.0/0` would. This host and the other
            sandboxes stay refused whatever a rule says. A name that resolves
            into private space is still taken out of the answer unless a rule
            that names it allows it (`allowPrivate`).
        domains:
          type: array
          maxItems: 256
          items: { type: string }
          description: >-
            Names, with `*.` for everything under one. `*.github.com` does not
            cover `github.com` — the two are written separately, because a
            wildcard that silently included its parent is a rule people get
            wrong in the direction of more access. A wildcard also lets the
            workload ask about any name under it, and those questions reach
            that domain's own nameservers: allowing `*.example.com` trusts
            whoever runs example.com with whatever the workload puts in a name.
          example: ["github.com", "*.github.com"]
        cidrs:
          type: array
          maxItems: 256
          items: { type: string }
          description: >-
            IPv4 ranges, for what has no name: a package mirror on a fixed
            address, a metadata service. Open for as long as the rule is —
            they are not resolved, so `pinTtl` does not apply to them.
          example: ["10.4.0.0/24"]
        ports:
          type: array
          maxItems: 64
          items: { type: string }
          description: >-
            What this rule's names and ranges are reachable on, written
            `tcp/443`, `udp/3478` or `tcp/8000-8100`. Absent or empty means
            the web ports — `tcp/80` and `tcp/443`.
          example: ["tcp/22"]
        pinTtl:
          $ref: "#/components/schemas/PinTtl"
        allowPrivate:
          type: boolean
          description: >-
            Whether this rule's names may resolve into private, loopback or
            link-local space. Off by default: an A record is written by
            whoever runs the domain, so without this a name that resolves to
            `10.0.0.5` opens the operator's own network to the sandbox. Such
            an address is taken out of the answer unless a rule that allows
            the name allows it.
        paused:
          type: boolean
          description: |
            A paused rule is kept, as it was written, and opens nothing: its
            ranges are closed, its names no longer resolve — a name only
            paused rules allow is refused as that, not as one nothing allows —
            and the addresses they were pinned to are revoked. Connections
            already open go on, as they do when a rule is deleted: the kernel
            judges a connection when it starts. Resumed, it opens what it
            did, and its names are pinned again as they are next resolved.

            Absent is `false`. Like every other field it is part of the rule,
            so a `PUT` without it resumes the rule it replaces;
            `POST .../pause` and `.../resume` change this alone.

    PinTtl:
      type: object
      description: |
        How long an address this rule's names resolve to stays open: the
        DNS answer's own TTL, held between these two bounds. Resolved again,
        the address is pinned again for the new answer's TTL; not resolved
        again, it is revoked when that runs out, and a connection already
        open through it goes on.

        The floor exists because a program that resolves once and connects
        twice — a pool, a retry — is normal, and an answer with a TTL of zero
        would otherwise open the way for a moment and close it behind the
        first connection. The ceiling because an address a CDN reassigns is
        somebody else's.
      properties:
        minSeconds:
          type: integer
          minimum: 1
          maximum: 604800
          description: >-
            The shortest an address stays open, whatever the answer's TTL.
            Absent is 60.
        maxSeconds:
          type: integer
          minimum: 1
          maximum: 604800
          description: >-
            The longest, whatever the answer's TTL. Absent is 86400, a day.
            At least `minSeconds`; both at most a week.
      example: { minSeconds: 60, maxSeconds: 3600 }

    EgressStatus:
      type: object
      description: |
        A sandbox's network as it is now, read from the places that decide
        it rather than from what was asked for: its resolver, for what is
        open by name; the kernel, for the rules it judges each packet by and
        the connections it is tracking.

        Every list is present, and empty when there is nothing in it — a
        sandbox with no interface has no rules, no pins and no connections,
        and that is an answer.
      required: [policy, interface, resolved, rules, connections, refusals, truncated]
      properties:
        policy: { $ref: "#/components/schemas/EgressSpec" }
        interface: { $ref: "#/components/schemas/Interface" }
        resolved:
          type: array
          description: |
            The addresses open now because a name a rule allows resolved to
            them, which rule, and when each is revoked. This is what the
            kernel is enforcing, where `policy` is what was asked for — and
            they differ whenever a name has not been looked up yet.

            **A pin lasts as long as the answer it came from**, held between
            its rule's `pinTtl` bounds — a minute and a day unless the rule
            says otherwise. Asked again, the answer is pinned again for its
            own TTL. Not asked again, the address is revoked when `expiresAt`
            passes, and a connection already open through it goes on
            (`connections`); a new one is refused.
          items: { $ref: "#/components/schemas/ResolvedName" }
        rules:
          type: array
          description: >-
            The sandbox's chain, as the kernel has it in the sandbox's
            namespace, in the order it is judged: the first rule that matches a packet decides it. Each
            counts what it has matched, so "is anything reaching the rule I
            think allows it" is answered here.
          items: { $ref: "#/components/schemas/FirewallRule" }
        connections:
          type: array
          description: >-
            Every connection this sandbox started that its namespace's kernel
            is still tracking. It is the table `ct state established` is
            decided from,
            so a connection listed here goes on whatever the policy has
            become since it was opened.
          items: { $ref: "#/components/schemas/Connection" }
        refusals:
          type: array
          description: >-
            The most recent things this sandbox tried to reach and could not,
            newest first: names its resolver would not answer, and targets its
            firewall dropped. Capped by this host.
          items: { $ref: "#/components/schemas/EgressRefusal" }
        truncated:
          type: boolean
          description: The cap was reached and older refusals were dropped.
        problems:
          type: array
          description: >-
            What could not be read, each in a sentence — the kernel's table,
            its connection tracking. The rest of the answer is still what was
            read.
          items: { type: string }

    FirewallRule:
      type: object
      required: [match, verdict, packets, bytes]
      properties:
        match:
          type: string
          description: >-
            What the rule matches, as nft writes it. Empty for a rule that
            matches everything, which is how the chain ends.
          example: ip daddr 192.0.2.0/24 tcp dport 443
        verdict:
          type: string
          description: What happens to a packet it matches.
          example: accept
        why:
          type: string
          description: Why the rule is there, as it was written into the kernel.
          example: "rule package-mirror: 10.4.0.0/24"
        packets: { type: integer, format: int64, example: 42 }
        bytes: { type: integer, format: int64, example: 5120 }

    Connection:
      type: object
      required: [protocol, source, destination]
      properties:
        protocol:
          type: string
          description: tcp, udp or icmp, or the protocol's number for anything else.
          example: tcp
        source:
          type: string
          description: The sandbox's end, as it sent it.
          example: 172.30.4.2:40312
        destination:
          type: string
          description: >-
            Where it was going, as the sandbox asked — before this host's
            masquerade made the connection this host's.
          example: 140.82.121.4:443
        state:
          type: string
          description: A TCP connection's state, as conntrack names it.
          example: ESTABLISHED
        sentBytes: { type: integer, format: int64 }
        receivedBytes: { type: integer, format: int64 }
        sentPackets: { type: integer, format: int64 }
        receivedPackets: { type: integer, format: int64 }
        expiresInSeconds:
          type: integer
          description: >-
            How long the kernel goes on tracking it if nothing more is sent —
            for an idle TCP connection, how long it stays open.
          example: 431999

    KillConnections:
      type: object
      additionalProperties: false
      description: >-
        Which connections to kill: those that match everything given. At
        least a `destination` or a `source` — a body that names neither would
        kill everything the sandbox has open, and that is asked for by
        naming it rather than by leaving something out.
      properties:
        destination:
          type: string
          description: >-
            Where the connections went, as `connections[].destination` says
            it: an address, for every connection to it, or an address and a
            port.
          example: 140.82.121.4:443
        source:
          type: string
          description: >-
            The sandbox's end of one connection, as `connections[].source`
            says it: its address and port.
          example: 172.30.4.2:40312
        protocol:
          type: string
          description: tcp, udp or icmp, or the protocol's number. Absent is any.
          example: tcp

    EgressRefusal:
      type: object
      description: >-
        One thing a sandbox tried to reach and could not. The reason this is
        reported at all: a deny-by-default network whose denials are invisible
        is a network people switch off.
      required: [at, target]
      properties:
        at:
          type: string
          format: date-time
          description: >-
            When it was last refused. From the kernel's side it is to the
            second, and at most a second early.
        target:
          type: string
          description: The name that did not resolve, or the `address:port` that was dropped.
          example: registry.npmjs.org
        kind:
          type: string
          enum: [dns, connect]
          description: >-
            Which half refused it. `dns` is a name no rule allows; `connect` is
            an address that resolved, or was dialled directly, and is not pinned
            open — usually a port its rule does not name.
        protocol:
          type: string
          description: For a `connect` refusal, tcp or udp.
          example: tcp
        reason:
          type: string
          description: For a `dns` refusal, why the name was not answered.
          example: no rule allows it
        count:
          type: integer
          description: >-
            How many times this exact target was refused in the window.
            Collapsed, because a retry loop would otherwise fill the buffer with
            one mistake and hide the others.

    ResolvedName:
      type: object
      description: >-
        One address pinned open: the name that resolved to it, and the rule
        that allowed that name. A name two rules allow is listed once for
        each, with each rule's ports and each rule's expiry.
      required: [rule, name, address, ports, expiresAt]
      properties:
        rule:
          type: string
          description: The rule whose ports and `pinTtl` this pin was made with.
          example: github-ssh
        name: { type: string, example: github.com }
        address: { type: string, example: 140.82.121.4 }
        ports:
          type: array
          description: What it is open on, as its rule says.
          items: { type: string }
          example: ["tcp/22"]
        expiresAt:
          type: string
          format: date-time
          description: When this pin is revoked, unless the name is resolved again first.

    Interface:
      type: object
      description: >-
        The network namespace this sandbox was given, and the interface in it.
        Reported rather than requested: nothing in a spec names a namespace, a
        device, an address or a subnet, because a caller that could choose one
        could choose another sandbox's.
      required: [namespace, tap, veth, guest, host, mask]
      properties:
        namespace:
          type: string
          description: >-
            The sandbox's network namespace, for an operator: `ip netns exec
            <namespace> nft list ruleset` is its firewall as the kernel has it.
            Named for this daemon's instance and the sandbox.
          example: runyard-main-0192f7a4-5b1e-7c3d-9a2f-3b8c1d2e4f60
        tap:
          type: string
          description: The guest's device, inside `namespace`.
          example: tap0
        veth:
          type: string
          description: >-
            The sandbox's only device in the host's own namespace: its link to
            the host, for an operator reading `ip link` there. Named for this
            daemon's instance and the sandbox's /30, in hexadecimal.
          example: rymain-100
        guest: { type: string, example: 172.30.4.2 }
        host:
          type: string
          description: >-
            The guest's gateway on its /30, which is in `namespace` and not an
            address of the host's.
          example: 172.30.4.1
        mask: { type: integer, example: 30 }
        mac: { type: string, example: "02:00:ac:1e:04:02" }
        dns:
          type: string
          description: >-
            The resolver the guest is told about, and the only one it can reach.
            A guest that asked somebody else's would bypass the allowlist — and
            then reach nothing, because the firewall only opens what this
            resolver answered.
          example: 172.30.4.1

    PublishedPort:
      type: object
      required: [guest]
      properties:
        guest: { type: integer, minimum: 1, maximum: 65535, example: 8080 }
        host:
          type: integer
          description: >-
            The host port. Absent takes an ephemeral one, and the sandbox
            reports which — that is the ordinary case, since a caller reading
            the answer needs no port to be free in advance.
          minimum: 1
          maximum: 65535
        bind:
          type: string
          description: >-
            Which host address to bind. Defaults to `127.0.0.1`, deliberately:
            the alternative default publishes an untrusted workload to whoever
            can reach this host, and that is a decision to type rather than to
            inherit.
          default: "127.0.0.1"
        protocol:
          type: string
          enum: [tcp, udp]
          default: tcp

    SandboxState:
      type: string
      description: |
        | state | what it means | what to do |
        |---|---|---|
        | `creating` | the image is being pulled, the disk made, the rules installed | wait, or read the events |
        | `booting` | the hypervisor is up, the guest has not answered | wait |
        | `ready` | the guest answers | use it |
        | `unreachable` | it was ready and is not answering now | retry; it may come back |
        | `paused` | frozen on purpose, its memory and processes kept | `POST /resume` |
        | `stopped` | shut down on purpose, disk intact | `POST /start` |
        | `failed` | it will not become ready; `error` says why | read the events, then delete |
        | `gone` | the machine is no longer on this host | delete the record |
      enum: [creating, booting, ready, unreachable, paused, stopped, failed, gone]

    Sandbox:
      type: object
      required: [id, state, spec, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Minted by this daemon and never reused on this host, so it names
            one machine for the whole of its life and no other machine after
            it. It is what the sandbox's identity is made of.
          example: 0192f7a4-5b1e-7c3d-9a2f-4e6b8c1d0a53
        state: { $ref: "#/components/schemas/SandboxState" }
        spec:
          allOf: [{ $ref: "#/components/schemas/SandboxSpec" }]
          description: >-
            What was asked for, with this host's defaults filled in — so a
            caller that sent three fields can see the other nine it got.
        labels:
          type: object
          additionalProperties: { type: string }
          description: >-
            The live set, which is what `?label=` matches. `spec.labels` is what
            it was created with; the two start equal and diverge only when
            somebody calls `PUT .../labels`. The spec is intent and this is what
            is true now.
        error:
          type: string
          description: Why it is `failed` or `unreachable`, for a person. Present only then.
        image:
          type: object
          description: What `spec.image` actually resolved to.
          properties:
            id: { type: string, example: img_9f2a1c4e7b30 }
            digest:
              type: string
              description: >-
                Pinned at creation. A tag that moves afterwards does not move
                this machine, which is what makes a sandbox reproducible enough
                to debug.
        disk:
          type: object
          description: What the disk actually turned out to be.
          properties:
            cloned:
              type: boolean
              description: >-
                Whether this sandbox's own disk was made by sharing blocks
                rather than copying them. It is an empty filesystem of a few
                megabytes either way, and the image under it is never copied —
                so this no longer says what a sandbox costs. `allocatedBytes`
                does.
            bytes:
              type: integer
              format: int64
              description: The declared size — what the guest sees.
            allocatedBytes:
              type: integer
              format: int64
              description: >-
                What it costs on this host right now. The other number, and the
                one that fills a volume.
        network: { $ref: "#/components/schemas/Interface" }
        brokers:
          type: array
          description: >-
            The brokered upstreams this sandbox was given, and the loopback port
            each one is carried on inside the machine.
          items: { $ref: "#/components/schemas/SandboxBroker" }
        identity:
          $ref: "#/components/schemas/Identity"
        ports:
          type: array
          description: >-
            The published ports as they ended up, with the host port filled in
            for every one that asked for an ephemeral.
          items: { $ref: "#/components/schemas/PublishedPort" }
        guest:
          type: object
          description: >-
            The guest agent, once it has answered. Absent until it has.
          properties:
            protocol:
              type: integer
              description: >-
                The guest API version the agent says it speaks: what this
                daemon talks to it in, and nothing more.
            bootMs:
              type: integer
              description: >-
                From the hypervisor starting to the agent answering, measured
                on this host rather than said by the guest. Here
                because it is the number anybody tuning this watches, and
                because a sandbox that takes thirty seconds and one that takes
                two look identical afterwards.
        createdBy:
          allOf: [{ $ref: "#/components/schemas/Creator" }]
          description: >-
            Who made it. Absent on a sandbox made before this was recorded,
            which is then nobody's: a key that acts only on its `own`
            sandboxes does not see it.
        createdAt: { type: string, format: date-time }
        readyAt:
          type: string
          format: date-time
          description: When the guest first answered. Absent until it has.

    SandboxBroker:
      type: object
      required: [name, port, kind]
      properties:
        name: { type: string, example: github }
        port:
          type: integer
          description: >-
            The port on `127.0.0.1` inside the sandbox. What is listening on it
            is the agent, carrying the connection out over vsock. It does not
            change for as long as this sandbox has the broker, across stops and
            starts.
          example: 61000
        kind: { $ref: "#/components/schemas/BrokerKind" }
        url:
          type: string
          description: >-
            Where its connections go now. For a shared broker this is the shared
            broker's current upstream, and changes when that does. A client
            broker has none.
          example: https://broker.internal:8443/
        description: { type: string }

    BrokerKind:
      type: string
      description: >-
        `shared` is the host's shared broker of that name. `one_off` is an
        upstream declared for this sandbox alone. `client` is one a caller of
        this API is serving right now, with `GET
        /v1/sandboxes/{id}/brokers/{name}/serve`, and is gone when it stops.
      enum: [shared, one_off, client]
      # Named, because the generator's own name for the last one is `Client`,
      # which is what it calls the client it generates.
      x-enum-varnames: [BrokerKindShared, BrokerKindOneOff, BrokerKindClient]

    SandboxBrokerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SandboxBroker" }

    SandboxBrokerSpec:
      type: object
      description: >-
        One broker in a spec. Without `upstream` it names a shared broker;
        with one it declares a broker for this sandbox alone.
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/BrokerName" }
        upstream: { $ref: "#/components/schemas/BrokerUpstream" }

    SandboxBrokerAttach:
      type: object
      description: >-
        What `PUT .../brokers/{name}` gives a sandbox. An empty object is the
        shared broker of that name.
      properties:
        upstream: { $ref: "#/components/schemas/BrokerUpstream" }

    BrokerName:
      type: string
      description: >-
        Lower-case letters, digits and dashes, starting and ending with a
        letter or digit. Narrow because it becomes more than a name: it is a
        key in `/run/runyard/brokers.json` and, upper-cased, part of the
        `RUNYARD_BROKER_<NAME>_URL` variable in `brokers.env`, where anything
        wider would be a name two brokers could collide on.
      pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
      example: github

    BrokerUpstream:
      type: object
      description: Where a broker's connections are carried, and how to trust it.
      required: [url]
      properties:
        url:
          type: string
          description: >-
            `https`, always. The identity this plane exists to present is a TLS
            client certificate, and plain http has nowhere to attach one. Only
            the host and port are used: the sandbox's request carries its own
            path.
          example: https://broker.internal:8443/
        description:
          type: string
          description: >-
            What it is for, for a person — in this API and in the console.
        ca:
          type: string
          description: >-
            PEM certificates to verify the upstream with, for one with a private
            CA. Absent uses this host's roots. A certificate, not a key: there is
            nowhere in this document for a secret to go.

    Broker:
      type: object
      description: A shared broker, as this host declares it.
      required: [name, url]
      properties:
        name: { $ref: "#/components/schemas/BrokerName" }
        url: { type: string, example: https://broker.internal:8443/ }
        description: { type: string }
        ca:
          type: string
          description: The PEM it verifies the upstream with, when it has its own.
        sandboxes:
          type: integer
          description: >-
            How many sandboxes on this host are given it right now. Left out
            for a key that acts only on its `own` sandboxes.

    BrokerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Broker" }

    Identity:
      type: object
      description: |
        What an upstream sees when this sandbox calls it.

        The certificate itself is on the host and the private key never enters a
        guest — this is what it looks like from outside, so an operator reading
        an upstream's logs can tell which machine made a call, and an upstream's
        own configuration can be written against `uri` rather than against a
        shared secret.
      required: [uri, subject, fingerprint, notAfter]
      properties:
        uri:
          type: string
          description: >-
            The certificate's URI subject alternative name, which is what an
            upstream should match on. It carries the host as well as the
            sandbox, so two deployments whose CAs an upstream trusts do not
            collide — and the sandbox by its id, never its name, so a sandbox
            made after this one is dropped is a different caller even when a
            person gave both the same `labels.name`.
          example: runyard-sandbox://sandboxes-lon-1/0192f7a4-5b1e-7c3d-9a2f-4e6b8c1d0a53
        subject:
          type: string
          description: The common name, which is the sandbox id.
          example: 0192f7a4-5b1e-7c3d-9a2f-4e6b8c1d0a53
        fingerprint:
          type: string
          description: SHA-256 of the certificate, hex — what an upstream's log will have.
        notAfter:
          type: string
          format: date-time
          description: >-
            When it lapses: minutes, not hours, and re-minted while the sandbox
            runs. The certificate is the sandbox's whole authority, and one that
            outlives the machine is one an upstream would accept from something
            that no longer exists — which is why there is no revocation list to
            consult, only a lifetime too short to need one.

    SandboxEvent:
      type: object
      required: [seq, at, type]
      properties:
        seq: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        type:
          type: string
          enum: [state, progress, error, operation]
          description: >-
            `progress` is the one that makes a thirty-second `creating`
            bearable: pulling a layer, flattening the rootfs, making the disk,
            installing the rules. `operation` is a call somebody made on this
            sandbox, and carries `operation` saying who and how it went.
        state: { $ref: "#/components/schemas/SandboxState" }
        operation: { $ref: "#/components/schemas/SandboxOperation" }
        message:
          type: string
          description: >-
            What happened, for a person. On an `error` this is the sentence that
            explains a `failed`, and it is the reason this stream exists.
          example: "cloud-hypervisor exited: no bootable disk"

    SandboxOperation:
      type: object
      required: [name, status, durationMs]
      description: |
        One call made on a sandbox through this API, written into its history
        once it has been answered: who made it, what it was, and what it was
        told.

        Every call that CHANGES something is here — creating, stopping,
        starting, pausing, resuming and deleting it, its labels, its egress and
        its brokers, a command run, a process started, signalled or reaped, a
        file written or deleted, a terminal opened. Reads are not, and neither
        is a write to a process's stdin, which is a stream of bytes rather than
        a decision. A call refused before it reached the sandbox — no key, or
        a key without the scope — is not either: it did not happen to this
        machine.

        What was asked is said without what it carried. A command is its
        program, never its arguments or its environment, which hold whatever
        their author put in them; a file is its path, never its contents.
        Anyone who may read this sandbox may read this.
      properties:
        name:
          type: string
          description: The `operationId` of the route that was called.
          example: pauseSandbox
        user:
          type: string
          format: email
          description: >-
            The person the call was made as: the one signed in, or the owner
            of the key it carried.
          example: ada@example.com
        key:
          type: object
          required: [id]
          description: The key that made the call, when a key made it.
          properties:
            id: { type: string, example: 7f3a9c21 }
            name: { type: string, example: ci-scheduler }
        target:
          type: string
          description: >-
            What within the sandbox it was about, where it was about something:
            the program a command ran, a process's id, a file's path, a
            broker's name.
          example: pytest
        status:
          type: integer
          description: >-
            The HTTP status it was answered with. A `4xx` or `5xx` is a call
            that was made and refused, which is part of what happened.
          example: 200
        durationMs:
          type: integer
          format: int64
          description: >-
            How long it took to answer. For a terminal, how long it was open;
            the event is written when it closes.

    SandboxHostUsage:
      type: object
      description: Measured here. True.
      properties:
        cpuPercent:
          type: number
          format: double
          description: >-
            How busy the machine's vCPUs were since the last reading, as a
            share of all of them: `100` is every vCPU the sandbox was given,
            busy the whole time. The hypervisor's own device threads count
            too — they are CPU the host spends on this machine — so a
            saturated machine can read slightly over `100`. Absent until
            there are two readings to take a difference between.
          example: 37.5
        cpuSeconds:
          type: number
          format: double
          description: >-
            CPU time the hypervisor process has used since it started, user
            and system together. `cpuPercent` is the rate this grows at.
        memoryBytes:
          type: integer
          format: int64
          description: >-
            What the hypervisor process holds, which is what the host pays.
            Memory the guest frees goes back to the host, and so does page
            cache it has not touched for two minutes, so this follows what the
            guest uses rather than the most it ever touched.
        diskAllocatedBytes:
          type: integer
          format: int64
          description: >-
            What the sandbox's own disk has allocated on the host. Not the size
            it was given: a disk is sparse, and what it costs is what it wrote.
        rxBytes:
          type: integer
          format: int64
          description: Bytes the guest received on its interface since the machine started.
        txBytes:
          type: integer
          format: int64
          description: Bytes the guest sent on its interface since the machine started.
        rxBytesPerSecond:
          type: number
          format: double
          description: >-
            The rate `rxBytes` grew at since the last reading. Absent until
            there are two.
        txBytesPerSecond:
          type: number
          format: double
          description: >-
            The rate `txBytes` grew at since the last reading. Absent until
            there are two.
        brokerRxBytes:
          type: integer
          format: int64
          description: >-
            Bytes the guest received through its brokers since the machine
            started, counted by this host as it carried them. A sandbox with no
            interface reaches the world only this way, so for one of those this
            is all of its traffic and `rxBytes` is none of it.
        brokerTxBytes:
          type: integer
          format: int64
          description: Bytes the guest sent through its brokers since the machine started.
        brokerRxBytesPerSecond:
          type: number
          format: double
          description: The rate `brokerRxBytes` grew at since the last reading.
        brokerTxBytesPerSecond:
          type: number
          format: double
          description: The rate `brokerTxBytes` grew at since the last reading.
        brokerConnections:
          type: integer
          description: >-
            Brokered connections open now: each one a connection this host is
            carrying to an upstream for the guest. Measured here, unlike the
            guest's own socket counts.
        uptimeSeconds: { type: integer, format: int64 }

    SandboxGuestUsage:
      type: object
      description: >-
        What the guest said about itself at one reading, reduced to numbers a
        chart can draw: whatever runs as root in the sandbox can make it say
        anything. **Nothing may be decided from it**, and the console marks it
        as the guest's.
      properties:
        memoryUsedBytes: { type: integer, format: int64 }
        memoryTotalBytes: { type: integer, format: int64 }
        diskUsedBytes: { type: integer, format: int64 }
        diskTotalBytes: { type: integer, format: int64 }
        tcpEstablished:
          type: integer
          description: TCP connections in `ESTABLISHED`, IPv4 and IPv6 together.
        tcpListening:
          type: integer
          description: TCP sockets in `LISTEN`.
        tcpTotal:
          type: integer
          description: >-
            Every TCP socket in the guest, whatever its state — including those
            still closing, which is where a leak shows first.
        udpSockets:
          type: integer
          description: Open UDP sockets.
        load1:
          type: number
          format: double
          description: >-
            The guest's one-minute load average. Unlike `host.cpuPercent` it
            does not stop at the vCPUs the sandbox has: above that count, work
            was waiting for one.

    SandboxUsagePoint:
      type: object
      required: [at, host]
      properties:
        at:
          type: string
          format: date-time
          description: >-
            When the reading was taken, or for a coarse point the start of the
            minute it summarises.
        host: { $ref: "#/components/schemas/SandboxHostUsage" }
        guest: { $ref: "#/components/schemas/SandboxGuestUsage" }

    SandboxMetricsHistory:
      type: object
      required: [window, stepSeconds, points]
      properties:
        window: { $ref: "#/components/schemas/MetricsWindow" }
        stepSeconds:
          type: integer
          description: >-
            How far apart the points are meant to be. A gap wider than this is
            time the machine was not running, and a chart should draw it as a
            gap rather than a line across it.
          example: 10
        points:
          type: array
          description: Oldest first.
          items: { $ref: "#/components/schemas/SandboxUsagePoint" }

    HostMetricsHistory:
      type: object
      required: [window, stepSeconds, points]
      properties:
        window: { $ref: "#/components/schemas/MetricsWindow" }
        diskMount:
          type: string
          description: >-
            Where the filesystem the disk figures are of is mounted: the one
            holding the state directory, which is where every sandbox's disk
            is — not necessarily the host's root. Absent until the host has
            been read.
          example: /var/lib
        diskFilesystem:
          type: string
          description: >-
            Its type. `tmpfs` is worth seeing: sandboxes' disks there are held
            in memory, and are counted in the memory in use too.
          example: ext4
        stepSeconds:
          type: integer
          description: >-
            How far apart the points are meant to be. A gap wider than this is
            time the daemon was not running.
          example: 10
        points:
          type: array
          description: Oldest first.
          items: { $ref: "#/components/schemas/HostUsagePoint" }

    HostUsagePoint:
      type: object
      required: [at, cpus, sandboxes]
      description: >-
        One reading of the host. A field the host could not be read for is
        absent, and the CPU share is absent on the first reading after the
        daemon starts: it is a difference between two.
      properties:
        at: { type: string, format: date-time }
        cpus:
          type: integer
          description: The host's CPUs, which `cpuPercent` is a share of.
          example: 16
        cpuPercent:
          type: number
          format: double
          description: >-
            How busy all of the host's CPUs were since the last reading. `100`
            is every CPU busy the whole time.
        memoryTotalBytes: { type: integer, format: int64 }
        memoryUsedBytes:
          type: integer
          format: int64
          description: What is not available to a new process — total less `MemAvailable`.
        load1:
          type: number
          format: double
          description: The one-minute load average.
        diskTotalBytes:
          type: integer
          format: int64
          description: The filesystem holding the state directory, where every disk lives.
        diskUsedBytes: { type: integer, format: int64 }
        sandboxes: { $ref: "#/components/schemas/HostSandboxesUsage" }

    HostSandboxesUsage:
      type: object
      required: [running, memoryBytes, diskAllocatedBytes]
      description: What this host's sandboxes were using of it, summed.
      properties:
        running:
          type: integer
          description: Sandboxes with a machine on this host, paused ones included.
        cpuPercent:
          type: number
          format: double
          description: >-
            Their hypervisors' CPU, as a share of ALL the host's CPUs, so it
            is on the same scale as the host's own `cpuPercent` and never
            more than it.
        memoryBytes:
          type: integer
          format: int64
          description: What their hypervisors hold.
        diskAllocatedBytes:
          type: integer
          format: int64
          description: What their disks have allocated.

    MetricsWindow:
      type: string
      enum: ["15m", "1h", "6h", "24h"]
      x-enum-varnames: [Window15m, Window1h, Window6h, Window24h]
      description: >-
        How far back. `15m` and `1h` are a reading every ten seconds; `6h` and
        `24h` are one point a minute, each the average of the readings in it.

    SandboxProcessTable:
      type: object
      required: [total, truncated, processes]
      properties:
        total:
          type: integer
          description: How many processes there were, whether or not all are listed.
        truncated:
          type: boolean
          description: The table was cut at the agent's cap, and `processes` is the first part of it by pid.
        cpuCount:
          type: integer
          description: The vCPUs the guest sees. A process's `cpuPercent` is of one of them.
        sampledMs:
          type: integer
          description: The window `cpuPercent` was measured over.
        processes:
          type: array
          items: { $ref: "#/components/schemas/SandboxProcessInfo" }

    SandboxProcessInfo:
      type: object
      required: [pid, ppid, name, state, kernelThread]
      properties:
        pid: { type: integer, example: 42 }
        ppid: { type: integer, example: 1 }
        name:
          type: string
          description: The kernel's name for it, at most fifteen characters.
          example: node
        state:
          type: string
          description: >-
            As /proc writes it: `R` running, `S` sleeping, `D` in
            uninterruptible sleep, `Z` a zombie nobody has reaped, `T` stopped,
            `I` idle.
          example: S
        argv:
          type: array
          items: { type: string }
          description: >-
            Its command line. Absent for a kernel thread, which has none, and
            for a zombie, whose is gone.
          example: ["node", "server.js", "--port", "8080"]
        uid: { type: integer, example: 1000 }
        user:
          type: string
          description: The name `uid` has in the guest's own /etc/passwd, when it has one.
          example: node
        threads: { type: integer }
        cpuPercent:
          type: number
          format: double
          description: >-
            Of ONE vCPU, over `sampledMs`, as `top` counts it: a process using
            two vCPUs fully reads 200.
        memoryRssBytes: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        kernelThread:
          type: boolean
          description: A thread of the guest's kernel rather than a process anything started.

    SandboxSocketTable:
      type: object
      required: [truncated, sockets]
      properties:
        truncated:
          type: boolean
          description: The table was cut at the agent's cap.
        sockets:
          type: array
          items: { $ref: "#/components/schemas/SandboxSocketInfo" }

    SandboxSocketInfo:
      type: object
      required: [protocol, family, localAddress, localPort, state]
      properties:
        protocol:
          type: string
          enum: [tcp, udp]
          x-enum-varnames: [SocketTCP, SocketUDP]
        family:
          type: string
          enum: [ipv4, ipv6]
          x-enum-varnames: [SocketIPv4, SocketIPv6]
        localAddress: { type: string, example: 0.0.0.0 }
        localPort: { type: integer, example: 8080 }
        remoteAddress:
          type: string
          description: Absent for a socket that is not connected to anything.
          example: 127.0.0.1
        remotePort: { type: integer, example: 51544 }
        state:
          type: string
          description: >-
            TCP's states by their usual names — `LISTEN`, `ESTABLISHED`,
            `TIME_WAIT`, … For UDP, `UNCONN` for a socket bound and not
            connected, which is what a UDP server is, and `ESTABLISHED` for one
            that is.
          example: LISTEN
        pid:
          type: integer
          description: The process holding it, when the agent could find one.
        process:
          type: string
          description: That process's name.
          example: node

    SandboxMetrics:
      type: object
      required: [host]
      properties:
        host: { $ref: "#/components/schemas/SandboxHostUsage" }
        guest:
          type: object
          additionalProperties: true
          description: >-
            The workload's account of itself, passed through whole. **Nothing
            may be decided from this.** Absent while the sandbox is not `ready`.

    CommandRequest:
      type: object
      required: [argv]
      properties:
        argv:
          type: array
          minItems: 1
          items: { type: string }
          description: Already split. Not a shell line.
          example: ["git", "status", "--porcelain"]
        dir: { type: string, example: /workspace }
        env:
          type: object
          additionalProperties: { type: string }
          description: Merged over the sandbox's. Visible to the workload.
        user:
          type: string
          description: >-
            Who to run as inside the guest, `name` or `uid:gid`. Absent is the
            image's own `USER`, which is what makes a command behave the way the
            same command in `docker run` does.
        timeoutSeconds:
          type: integer
          description: Zero means this host's default.
        maxOutputBytes:
          type: integer
          description: Caps each of stdout and stderr. Zero means this host's default.

    CommandResult:
      type: object
      required: [exitCode, stdout, stderr, truncated, durationMs]
      properties:
        exitCode:
          type: integer
          description: >-
            The command's own status. Non-zero is a successful exchange with an
            unsuccessful command.
        stdout: { type: string }
        stderr: { type: string }
        truncated:
          type: boolean
          description: Output hit the cap; what you have is the beginning of it.
        durationMs: { type: integer, format: int64 }

    ProcessRequest:
      allOf:
        - $ref: "#/components/schemas/CommandRequest"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              description: >-
                The caller's own, unique within this sandbox. What makes
                starting a process idempotent.
              example: build-1
            stdin:
              type: boolean
              description: >-
                Whether to keep a pipe open for `POST .../stdin`. Off by
                default: a process whose stdin is an open pipe nobody writes to
                is one that waits forever for input that is not coming, and that
                is the ordinary way this is got wrong.

    Process:
      type: object
      required: [id, argv, state, startedAt]
      properties:
        id: { type: string, example: build-1 }
        argv:
          type: array
          items: { type: string }
        state:
          type: string
          enum: [running, exited, signalled]
          description: >-
            `signalled` is separate from `exited` because a build killed by the
            OOM killer and a build that returned 137 are the same number and
            different problems.
        exitCode:
          type: integer
          description: Present when `exited`.
        signal:
          type: string
          description: Present when `signalled`.
          example: SIGKILL
        stdoutBytes:
          type: integer
          format: int64
          description: >-
            How much it has written. What a reader's `?from=` is an offset into,
            and what says whether there is anything new without fetching it.
        stderrBytes: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }

    SignalRequest:
      type: object
      required: [signal]
      properties:
        signal:
          type: string
          description: By name. `SIGTERM`, `SIGKILL`, `SIGINT`, `SIGHUP`, `SIGUSR1`.
          example: SIGTERM
        group:
          type: boolean
          default: true
          description: >-
            Send it to the process group. The default, because a `make` killed
            alone leaves its compiler running and the sandbox busy.

    DirListing:
      type: object
      required: [entries]
      properties:
        nextCursor:
          type: string
          description: >-
            Pass as `cursor` to continue. Absent means the end. A directory is
            listed in the order the filesystem reports it, and a file created
            during a walk is not promised to appear in it.
        entries:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              dir: { type: boolean }
              size: { type: integer, format: int64 }
              mode: { type: string, example: "0644" }
              uid: { type: integer }
              gid: { type: integer }
              modifiedAt: { type: string, format: date-time }
              symlink:
                type: boolean
                description: >-
                  Reported and never followed. A sandbox can point one at
                  anything, and a lister that followed them would walk out of
                  wherever it was asked to look.

    Page:
      type: object
      properties:
        nextCursor:
          type: string
          description: Pass as `cursor` to continue. Absent means the end.

    ImagePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Image" }

    SandboxPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items, total]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Sandbox" }
            total:
              type: integer
              minimum: 0
              description: >-
                How many sandboxes match the filters, on every page together:
                a list read a page at a time can still say how long it is.

    ProcessPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Process" }

    KeyPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Key" }

    Scope:
      type: string
      description: |
        | scope | what it opens |
        |---|---|
        | `sandboxes.read` | see sandboxes, their state, their network and their metrics |
        | `sandboxes.write` | make, stop, start and delete sandboxes |
        | `images.read` | see the image cache |
        | `images.write` | pull and delete images |
        | `network.write` | change a running sandbox's egress policy and its brokers |
        | `brokers.admin` | declare, replace and withdraw the host's shared brokers |
        | `tunnels.write` | publish a sandbox's ports through the gateway, say who may reach them, and mint their tokens |
        | `files.read` | read bytes out of a sandbox, including its process and socket tables |
        | `files.write` | write bytes into a sandbox |
        | `exec` | run commands and processes inside a sandbox |
        | `keys.admin` | mint and revoke its owner's keys, within its own scopes — an administrator's, anybody's |

        `exec` is separate from everything because it is arbitrary code in the
        sandbox, which a caller that only starts and stops machines has no need
        of and would be given by any coarser scope. `network.write` is separate
        from `sandboxes.write` for the same reason one level up: making a
        machine is a thing a scheduler does all day, and widening what an
        untrusted workload may reach is not a thing that should follow from it.
        `brokers.admin` is separate from both because a shared broker is where
        EVERY sandbox that names it is carried: changing one is changing all of
        them at once. `tunnels.write` is separate for the reason
        `network.write` is, the other way round: it opens a sandbox to people
        on the internet rather than the sandbox to the internet.
      enum:
        - sandboxes.read
        - sandboxes.write
        - images.read
        - images.write
        - network.write
        - brokers.admin
        - tunnels.write
        - files.read
        - files.write
        - exec
        - keys.admin

    KeyRequest:
      type: object
      required: [name, scopes, expiresAt]
      properties:
        name:
          type: string
          description: >-
            What this key is for, for whoever decides one day whether it should
            still exist. Required, because an unnamed key is one nobody can
            revoke with confidence.


            Text a person can read as it is written: not blank, and with no
            control or formatting character (Unicode `Cc` and `Cf` — a NUL, a
            newline, the marks that reverse the direction text reads in or
            take no width) and no line or paragraph separator. A name is
            shown in every list of keys, and those are how one is made to
            read as something it is not.
          example: "runyard server — lon-1"
        owner:
          type: string
          format: email
          description: >-
            Whose it is. The caller, when left out; only an administrator
            may name somebody else.
        scopes:
          type: array
          description: At least one. A scope named twice is held once.
          items: { $ref: "#/components/schemas/Scope" }
        expiresAt:
          type: string
          format: date-time
          description: >-
            Required, in the future, and at most ten years (3650 days) from
            now: a key that outlives anybody's memory of it is one nobody
            revokes. Answered, like every time of a key's, in UTC.
        sandboxes:
          allOf: [{ $ref: "#/components/schemas/KeyReach" }]
          description: >-
            Which sandboxes it acts on. `all`, when left out. A caller that
            is itself a key acting only on its `own` may ask for nothing
            wider.

    KeyReach:
      type: string
      description: |
        | reach | which sandboxes and volumes the key acts on |
        |---|---|
        | `all` | every one on this host |
        | `own` | those this very key made, and no others |

        Scopes say what a key may do; this says to what. A key with `exec`
        and `all` runs commands in every sandbox on the host, which is more
        than a program that makes its own sandboxes needs and exactly what
        somebody who steals its key wants.

        **`own` is the key's, not its owner's.** Two keys of one person each
        see what they made and nothing of the other's, and what a person made
        in the console is no key's. A console session is a person, and is
        never narrowed this way.

        To an `own` key:

        - **A sandbox that is not its own is one that does not exist.** Every
          route under `/v1/sandboxes/{sandboxId}` answers `404`, with one
          body, for somebody else's sandbox and for an id nothing has — before
          anything else about the request is looked at, so no other answer
          tells the two apart.
        - **A list holds only its own**: `GET /v1/sandboxes`, `/v1/volumes`
          and `/v1/tunnels`, and the counts of them in `GET /v1/counts`.
        - **A volume is its own when a sandbox it made first laid it down**
          (`Volume.createdBy`). A sandbox it makes may name a volume of its
          own or a name no volume has; any other is a `403`, which says
          nothing of the volume. `DELETE /v1/volumes/{name}` on one that is
          not its own answers as for a name no volume has.
        - **And a volume it laid down is its alone to attach.** No other
          caller boots a sandbox from it — not another key, not one that
          acts on `all`, not a person in the console: each is a `403`. What
          is on it is a root filesystem the key chose, and a sandbox somebody
          else booted from it would run that key's code as theirs. Whoever
          could drop it still can, which is how its name is had again.
        - **What speaks for the whole host is refused**, `403`: what the host
          has been using and has promised (`GET /v1/host/…`), and declaring
          or withdrawing a shared broker, which moves every sandbox given it.
        - **How many sandboxes use an image or a shared broker is left out**:
          most of them are not its own.

        Images, the shared brokers as a list, the host's description and the
        keys themselves are not sandboxes, and an `own` key reads and changes
        them as its scopes say. So `keys.admin` on one lists and revokes the
        keys its owner may — its owner's, and everybody's when its owner is
        an administrator — exactly as a key that acts on `all` does. What it
        cannot do is mint one that reaches further than itself.
      enum: [all, own]
      x-enum-varnames: [KeyReachAll, KeyReachOwn]

    Key:
      type: object
      description: A key's metadata. Never its secret.
      required: [id, name, owner, scopes, sandboxes, createdAt, expiresAt]
      properties:
        id: { type: string, example: k7f3a91c }
        name: { type: string }
        owner:
          type: string
          format: email
          description: >-
            Who it belongs to. It does what its scopes say and its owner may
            still do, whichever is less, and nothing once its owner is not
            let in any more.
          example: ada@example.com
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
        sandboxes: { $ref: "#/components/schemas/KeyReach" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt:
          type: string
          format: date-time
          description: >-
            When it was last accepted, to the minute. Coarse on purpose: this is
            for deciding whether a key is still in use, and a precise timestamp
            on every request is a write on every request.

    KeyCreated:
      allOf:
        - $ref: "#/components/schemas/Key"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: >-
                The whole key, `rysk_<id>_<secret>`. **This is the only time it
                exists outside the caller.**
              example: rysk_k7f3a91c_9Qm2xV8sT1pLd0aZbN4wK7yR

    KeyAuthorizationRequest:
      type: object
      description: >-
        A key a person approves for a program, as `KeyRequest` describes one,
        and what the code for it is bound to. It has no `owner`: the key is
        its approver's.
      required: [name, scopes, expiresAt, codeChallenge]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            What the key is called, as `KeyRequest.name`: what its owner will
            read in a list one day, deciding whether it should still exist.
            From the console's page it is what the program asking called
            itself (`client`). Text a person can read, as `KeyRequest.name`
            is, and bounded in length here, since this one is written by a
            link.
          example: ryclaude on ada-laptop
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
        expiresAt:
          type: string
          format: date-time
          description: >-
            When the KEY expires — not the code, which lasts five minutes.
            Required, and within ten years, as `KeyRequest.expiresAt`.
        sandboxes:
          allOf: [{ $ref: "#/components/schemas/KeyReach" }]
          description: >-
            Which sandboxes the key acts on. `all`, when left out, as for
            `KeyRequest`.
        codeChallenge:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: >-
            The SHA-256 of the `codeVerifier` the redeem will show, in
            base64url without padding: RFC 7636's `S256`, and the only method
            there is here. Exactly the 43 characters 32 bytes make. `plain`
            is not offered, since it would make the challenge — which the
            browser's address carried — the verifier.
          example: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        redirectUri:
          type: string
          maxLength: 2048
          description: |
            Where the page will take the browser with the code. Left out when
            the page shows the code for the person to paste instead.

            `http://127.0.0.1:<port>/…`, `http://localhost:<port>/…` or
            `http://[::1]:<port>/…` and nothing else, as it is written: the
            scheme in small letters, that host spelled that way, a port
            written as a number is (`49152`, not `049152`) that is neither 0
            nor 80, no user or password, no fragment, no space or backslash.
            Port 80 is refused because a browser leaves it out of an address
            that names it, and what the page read would not be what was
            written. Loopback is the machine
            the browser is on, which is the one the program asking runs on,
            and plain HTTP is all a program listening there for a moment can
            serve. It is checked and not kept: the code goes to whoever
            redeems it with the verifier, wherever the browser took it.
          example: "http://127.0.0.1:49152/callback"

    KeyAuthorization:
      type: object
      description: An approval waiting to be redeemed.
      required: [code, expiresAt]
      properties:
        code:
          type: string
          description: >-
            What `POST /v1/keys/authorizations/redeem` trades for the key,
            with the verifier: 32 random bytes in base64url. **This is the
            only time it exists outside the caller**; what is stored is a
            SHA-256 of it.
          example: 3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        expiresAt:
          type: string
          format: date-time
          description: When the code stops working, five minutes after it was given.

    KeyAuthorizationRedemption:
      type: object
      required: [code, codeVerifier]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
          description: The code the approval gave, as it was given.
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: "^[A-Za-z0-9._~-]{43,128}$"
          description: >-
            What the program made before it asked, and has shown nobody since:
            RFC 7636's `code_verifier`, 43 to 128 unreserved characters. Its
            SHA-256, in base64url without padding, is the `codeChallenge` the
            approval was given. Anything else redeems nothing, though its
            hash is the challenge, and spends the code as a wrong verifier
            does: a challenge made from something short enough to guess is
            not one a key is handed over for.
          example: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk

    TunnelSpec:
      type: object
      description: What a tunnel is, as its writer says it.
      required: [port]
      additionalProperties: false
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: >-
            The TCP port inside the sandbox, reached on its loopback — so a
            workload listening on `127.0.0.1` is reachable, and one that
            listens nowhere answers a visitor `502`.
          example: 3000
        description:
          type: string
          maxLength: 200
          description: What is behind it, for whoever reads the list.
          example: the preview of PR 1234
        access: { $ref: "#/components/schemas/TunnelAccess" }
        expiresAt:
          type: string
          format: date-time
          description: >-
            When it stops being served, if it should. Absent is never: a
            tunnel lives as long as its sandbox unless it is deleted. One in
            the past is a `400`. Past it, the tunnel is kept, reported
            `expired`, and served again only when this is moved or dropped.
        paused:
          type: boolean
          description: >-
            Kept and not served. A `PUT` without it serves the tunnel, so a
            replace resumes one — the same as an egress rule.
        overlay: { $ref: "#/components/schemas/TunnelOverlay" }

    TunnelOverlay:
      type: object
      description: |
        The **Share** button the gateway puts on this tunnel's pages, for a
        person named in `access.emails` — the tunnel's admins. It opens a page
        of the gateway's own, on the tunnel's address, where an admin lets
        other people in as guests and takes them back out. People let in by
        `access.domains`, and guests, can reach the tunnel and share nothing.

        Only an HTML page opened as a document gets it, and only on a
        response the gateway can change safely: never a download, a range, an
        encoded body or anything a fetch or an iframe asked for. Everyone
        else gets the bytes the sandbox sent.
      additionalProperties: false
      properties:
        hidden:
          type: boolean
          description: >-
            No button on this tunnel's pages — for one serving an API, a canvas,
            or anything whose bytes must arrive exactly as sent. Admins can
            still share from the page, at `/.runyard/share` on its address.
        corner:
          type: string
          enum: [bottom-right, bottom-left, top-right, top-left]
          description: Where the button sits, off whatever the application keeps in the default corner.

    TunnelAccess:
      type: object
      description: |
        Who may reach a tunnel by signing in at the gateway. Nobody else can:
        a tunnel with no one named here is reached only by its tokens.

        Addresses are compared case-insensitively, and a domain matches an
        address at that domain exactly — `example.com` lets in
        `ada@example.com` and not `ada@dev.example.com`.
      additionalProperties: false
      properties:
        emails:
          type: array
          maxItems: 64
          items: { type: string, format: email, maxLength: 254 }
          example: [ada@example.com]
        domains:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 253
            pattern: "^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$"
          example: [example.com]

    Tunnel:
      type: object
      required: [name, port, access, paused, overlay, createdAt, slug, tokens, status]
      properties:
        name: { type: string, example: preview }
        sandboxId:
          type: string
          format: uuid
          description: The sandbox it publishes a port of. Set in `GET /v1/tunnels`.
        port: { type: integer, example: 3000 }
        description: { type: string }
        access: { $ref: "#/components/schemas/TunnelAccess" }
        paused: { type: boolean }
        overlay: { $ref: "#/components/schemas/TunnelOverlay" }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        slug:
          type: string
          description: >-
            Its part of the address, minted with it and never reused: the name
            and six random characters. The gateway serves it at
            `<slug>--<namespace>.<domain>`.
          example: preview-k3v9qa
        url:
          type: string
          description: >-
            Where a visitor goes. Known once the relay has docked at a gateway
            and learnt the domain it serves; absent before.
          example: https://preview-k3v9qa--lon1.tunnels.example.com/
        tokens:
          type: array
          description: Every token minted for it, revoked ones included, oldest first.
          items: { $ref: "#/components/schemas/TunnelToken" }
        status: { $ref: "#/components/schemas/TunnelStatus" }

    TunnelStatus:
      type: object
      description: |
        Whether a visitor can reach it now, and if not, the first reason why.

        | state | what it means |
        |---|---|
        | `served` | the gateway serves it and the sandbox is running |
        | `paused` | kept, not served |
        | `expired` | its `expiresAt` has passed |
        | `sandbox_not_running` | served again when the sandbox is `ready` |
        | `pending` | handed to the relay, which has not taken it yet |
        | `relay_unreachable` | this host's relay is not answering |
        | `gateway_unreachable` | the relay is not docked at a gateway |
        | `refused` | the gateway would not serve it; `message` says why |
      required: [state]
      properties:
        state:
          type: string
          enum: [served, paused, expired, sandbox_not_running, pending, relay_unreachable, gateway_unreachable, refused]
        message: { type: string }
        connections:
          type: integer
          description: Visitors' connections open through it now, as the relay counts them.

    TunnelTokenRequest:
      type: object
      required: [comment]
      additionalProperties: false
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Who holds it and what for. Required, because a token nobody can
            name is one nobody can revoke with confidence.
          example: CI smoke test

    TunnelToken:
      type: object
      description: A token's record. Never the token.
      required: [id, comment, createdAt, revoked]
      properties:
        id: { type: string, example: t4kq9z2m }
        comment: { type: string }
        createdAt: { type: string, format: date-time }
        revoked: { type: boolean }
        revokedAt: { type: string, format: date-time }
        revokedReason: { type: string }

    TunnelTokenCreated:
      allOf:
        - $ref: "#/components/schemas/TunnelToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: >-
                The whole token, `ryt_<id>_<secret>`. **This is the only time it
                exists outside the caller.**
              example: ryt_t4kq9z2m_Xb8n2LqP0sVt6yWc3dRf7gHj

    TunnelRequest:
      type: object
      description: One request the gateway let through, or turned away, for a tunnel.
      required: [at, actorKind, method, path, status, durationMs]
      properties:
        at: { type: string, format: date-time }
        actorKind:
          type: string
          enum: [user, token, anonymous]
          description: >-
            A signed-in address, a token, or a request carrying neither —
            which the gateway turned away.
        actor:
          type: string
          description: The address, or the token's id.
        method: { type: string, example: GET }
        path: { type: string, example: /api/items }
        status: { type: integer, example: 200 }
        durationMs: { type: integer, format: int64 }

    TunnelGuest:
      type: object
      description: >-
        A person an admin let in from the tunnel's share page. They may reach
        it, and share nothing.
      required: [email, by, at]
      properties:
        email: { type: string, example: grace@example.com }
        by:
          type: string
          description: The admin who let them in.
          example: ada@example.com
        at: { type: string, format: date-time }

    TunnelGuestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Oldest first.
          items: { $ref: "#/components/schemas/TunnelGuest" }

    TunnelActivityPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/TunnelRequest" }

    TunnelRelay:
      type: object
      description: |
        This host's relay: the separate service that carries visitors from the
        gateway into sandboxes, and keeps doing so while this daemon restarts.
      required: [reachable, docked]
      properties:
        reachable:
          type: boolean
          description: Whether it answers on its socket.
        docked:
          type: boolean
          description: Whether it holds its line to a gateway. Without one no tunnel is reachable.
        gateway: { type: string, example: https://gateway.example.com }
        domain: { type: string, example: tunnels.example.com }
        namespace: { type: string, example: lon1 }
        message:
          type: string
          description: Why it is not reachable or not docked, when it is not.

    HostCommitments:
      type: object
      required: [running, cpus, memoryBytes, volumes, diskBytes]
      properties:
        running:
          type: integer
          minimum: 0
          description: >-
            The running sandboxes, paused ones included, which the CPUs and
            memory are of — as `sandboxes.running` in the host's history.
          example: 6
        cpus:
          type: integer
          minimum: 0
          description: Their vCPUs, together.
          example: 12
        memoryBytes:
          type: integer
          format: int64
          minimum: 0
          description: Their memory, together.
        volumes:
          type: integer
          minimum: 0
          description: >-
            The volumes, held by a sandbox or not, which the disk is of — as
            `GET /v1/volumes` lists them.
          example: 9
        diskBytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Their sizes, together — what they may grow to, not what they have
            written, which is `diskAllocatedBytes` in the host's history.

    HostCounts:
      type: object
      description: >-
        Each is what its own list would hold, filters left off: every sandbox
        `GET /v1/sandboxes` lists, every tunnel `GET /v1/tunnels` does, and so
        on. Absent is a count this key may not read. For a key that acts only
        on its `own` sandboxes the sandboxes, tunnels and volumes are its own,
        as those lists are, and the images and shared brokers are the host's,
        as theirs are.
      properties:
        sandboxes: { type: integer, minimum: 0 }
        tunnels: { type: integer, minimum: 0 }
        volumes: { type: integer, minimum: 0 }
        images: { type: integer, minimum: 0 }
        brokers:
          type: integer
          minimum: 0
          description: The host's shared brokers, as `GET /v1/brokers` lists them.

    HostTunnels:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [relay, items]
          properties:
            relay: { $ref: "#/components/schemas/TunnelRelay" }
            items:
              type: array
              items: { $ref: "#/components/schemas/Tunnel" }

    Error:
      type: object
      description: Every failure, in one shape.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: >-
                For a person reading a log. It may quote something a sandbox
                produced, so do not render it as anything but text.

    AuthMethods:
      type: object
      description: How a person may sign in to this daemon's console.
      required: [google]
      properties:
        google:
          type: boolean
          description: >-
            Whether `GET /v1/auth/google` signs somebody in here. Without it,
            nobody can sign in to the console.

    SignInError:
      type: string
      description: |
        Why a sign-in came back without a session, in `signInError` on the
        console's address.

        | value | what happened |
        |---|---|
        | `not_allowed` | Google vouched for the address, and this daemon does not let it in |
        | `unverified` | the account's address is not one Google has verified, so it is nobody's |
        | `expired` | the sign-in was not started here, was used already, or took longer than ten minutes |
        | `cancelled` | the person did not finish signing in with Google |
        | `failed` | Google's answer could not be checked, or the database did not answer |
      enum: [not_allowed, unverified, expired, cancelled, failed]
      x-enum-varnames: [SignInNotAllowed, SignInUnverified, SignInExpired, SignInCancelled, SignInFailed]

    Me:
      type: object
      description: Who a call is made as, and what they may do with it now.
      required: [email, admin, scopes, via]
      properties:
        email: { type: string, format: email, example: ada@example.com }
        name:
          type: string
          description: The name Google gave, when the person has signed in.
          example: Ada Lovelace
        picture:
          type: string
          description: >-
            Where this daemon serves the picture Google gave, when the person
            has signed in and has one: `GET /v1/me/picture`, with the
            picture's version, so that the address changes when it does.
          example: /v1/me/picture?v=5f1c0e9a2b7d4c31
        admin:
          type: boolean
          description: Named on this daemon's command line as an administrator, and so holding every scope.
        scopes:
          type: array
          description: >-
            What this call may do: everything its person may, for a session;
            for a key, those of its scopes its owner still may.
          items: { $ref: "#/components/schemas/Scope" }
        via:
          type: string
          enum: [session, key]
          x-enum-varnames: [ViaSession, ViaKey]
        key:
          type: object
          required: [id, name, sandboxes]
          description: The key the call carried, when it carried one.
          properties:
            id: { type: string }
            name: { type: string }
            sandboxes: { $ref: "#/components/schemas/KeyReach" }
        sessionExpiresAt:
          type: string
          format: date-time
          description: When the session ends and the person signs in again, when the call carried one.

    ErrorCode:
      type: string
      description: |
        Closed, because callers branch on it and a branch over an open string is
        a branch with a silent default.

        `image_unknown`, `unsupported_spec` and `capacity_exceeded` are the three
        that name something about this HOST rather than about the request, and
        each has its own next move: pull something else, go to a different host,
        come back later. A shared `bad_request` cannot tell them apart.
      enum:
        - bad_request
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - spec_conflict
        - image_unknown
        - image_in_use
        - volume_in_use
        - broker_in_use
        - unsupported_spec
        - too_large
        - gapped
        - sandbox_unreachable
        - sandbox_failed
        - quota_exceeded
        - capacity_exceeded
        - timeout
        - upstream_error
        - not_implemented
        - internal

    GapError:
      type: object
      required: [error, firstSeq, lastSeq]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
        firstSeq: { type: integer, format: int64 }
        lastSeq: { type: integer, format: int64 }

    StreamGap:
      type: object
      required: [error, firstByte, lastByte]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
        firstByte:
          type: integer
          format: int64
          description: The oldest offset still readable.
        lastByte: { type: integer, format: int64 }
